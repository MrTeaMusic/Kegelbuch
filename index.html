<script>

(() => {

  const FIXES = String.raw`- Klausur 19.12.2024, A3 (Weingläser): $P(Y\ge8)\approx3,88\,\%$ statt 3,71 % (Rechenfehler bei $0,4743^8$).

  const CHNUM = Object.fromEntries(CH.map((c, i) => [c.id, i]));
  const TYPECLS = {Definition: 'pri', Begriff: 'pri', Satz: 'acc', Beweis: 'acc', Formel: 'ok', Methode: 'ok', Beispiel: 'warn', Aufgabe: 'warn', Merke: 'pri', Tipp: 'warn'};
  const EXAMS = (() => {

  const examOf = src => { const m = /^(Klausur \d{2}\.\d{2}\.\d{4}|Probeklausur)/.exec(src || ''); return m ? m[1] : null; };

  /* ================= Hilfen ================= */

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const nf = (v, d = 4) => {
    if (!isFinite(v)) return String(v);

  };
  const pct = v => (v * 100).toLocaleString('de-DE', {maximumFractionDigits: 2}) + ' %';
  const plural = (n, s, p) => n + ' ' + (n === 1 ? s : p);
  let toastT = null;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
  function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* egal */ } }

  /* Textauszeichnung: $…$ inline, $$…$$ abgesetzt, "- " Liste, Leerzeile = Absatz */
  function md(t) {
    if (!t) return '';
    const parts = [];
    t = t.replace(/\$\$([\s\S]+?)\$\$/g, (m, x) => { parts.push(['block', x]); return '\u0001' + (parts.length - 1) + '\u0001'; });
    t = t.replace(/\$([^$]+?)\$/g, (m, x) => { parts.push(['inline', x]); return '\u0001' + (parts.length - 1) + '\u0001'; });
    t = t.replace(/<(?![a-zA-Z\/!])/g, '&lt;');
    t = t.replace(/<table/g, '<div class="tblwrap"><table').replace(/<\/table>/g, '</table></div>');
    const lines = t.split('\n');
    let html = '', inList = false, para = [];
    const flush = () => { if (para.length) { html += '<p>' + para.join('<br>') + '</p>'; para = []; } };
    for (const ln of lines) {
      if (/^\s*$/.test(ln)) { flush(); if (inList) { html += '</ul>'; inList = false; } continue; }
      const m = /^- (.*)$/.exec(ln);
      if (m) { flush(); if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + m[1] + '</li>'; continue; }
      if (inList) { html += '</ul>'; inList = false; }
      const bm = /^\s*\u0001(\d+)\u0001\s*$/.exec(ln);
      if (bm && parts[+bm[1]][0] === 'block') { flush(); html += ln.trim(); continue; }
      if (/^\s*<div class="tblwrap">/.test(ln)) { flush(); html += ln; continue; }
      para.push(ln);
    }
    flush(); if (inList) html += '</ul>';
    return html.replace(/\u0001(\d+)\u0001/g, (m, k) => {
      const [d, x] = parts[+k];
      return d === 'block' ? mblock(x) : inlineMath(x);
    });
  }
  const mblock = x => '<div class="mblock" data-tex="' + esc(x) + '">' + TEX.render(x, 'block') + '</div>';
  /* Lange Inline-Formeln an Relationszeichen in mehrere <math> teilen, damit der Browser umbrechen kann */
  function inlineMath(x) {
    if (x.length < 18) return TEX.render(x, 'inline');
    const p = TEX.split(x, 'both');
    if (p.length < 2) return TEX.render(x, 'inline');
    return '<span class="msplit">' + p.map(t => TEX.render(t, 'inline')).join(' ') + '</span>';
  }
  /* Abgesetzte Formeln, die zu breit sind, werden an Relationszeichen auf mehrere Zeilen verteilt */
  function fitMath(root) {
    const blocks = root.querySelectorAll('.mblock[data-tex]:not([data-fit])');
    for (const b of blocks) {
      const avail = b.clientWidth;
      if (!avail) continue;
      b.dataset.fit = '1';
      if (b.scrollWidth <= avail + 1) continue;
      const shrink = () => {
        let f = 1;
        for (let k = 0; k < 6 && b.scrollWidth > b.clientWidth + 1 && f > 0.7; k++) {
          f = Math.max(0.7, f * Math.min(0.97, (b.clientWidth - 4) / b.scrollWidth));
          for (const m of b.querySelectorAll('math')) m.style.fontSize = (f * 1.14).toFixed(3) + 'em';
        }
      };
      const meas = document.createElement('span');
      meas.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;left:0;top:0';
      b.appendChild(meas);
      const width = t => { meas.innerHTML = TEX.render(t, 'dinline'); return meas.getBoundingClientRect().width; };
      const limit = avail - 28;
      const lines = []; let cur = null;
      const put = (piece, joiner) => { if (cur === null) { cur = piece; return; } const cand = cur + joiner + piece; if (width(cand) <= limit) cur = cand; else { lines.push(cur); cur = piece; } };
      for (const g of TEX.split(b.dataset.tex, 'comma')) {
        if (width(g) <= limit) { put(g, '\\quad '); continue; }
        let first = true;
        for (const r of TEX.split(g, 'rel')) {
          const sub = width(r) <= limit ? [r] : TEX.split(r, 'add');
          for (const x of sub) { put(x, first ? '\\quad ' : ' '); first = false; }
        }
      }
      if (cur !== null) lines.push(cur);
      meas.remove();
      if (lines.length >= 2) {
        b.classList.add('split');
        b.innerHTML = lines.map((l, i) => `<div class="mline${i ? ' cont' : ''}">${TEX.render(l, 'block')}</div>`).join('');
      }
      if (b.scrollWidth > avail + 1) { b.classList.add('split'); shrink(); }
    }
  }
  let fitQueued = false;
  const queueFit = () => { if (fitQueued) return; fitQueued = true; requestAnimationFrame(() => { fitQueued = false; try { fitMath(view); } catch (e) { /* */ } }); };
  new MutationObserver(queueFit).observe(view, {childList: true, subtree: true, attributes: true, attributeFilter: ['open', 'hidden', 'class']});
  window.addEventListener('resize', () => { view.querySelectorAll('.mblock[data-fit]').forEach(b => { if (!b.classList.contains('split')) b.removeAttribute('data-fit'); }); queueFit(); });

  /* ================= Wiederholen-Stapel (vereinfachtes Spaced Repetition) =================

  function cardResult(id, known) {

  /* ================= Routing ================= */

  /* ---------- Sitzungen (Karten, Quiz, Wiederholen) ---------- */
  function startCards({c = null, mode = 'all'}) {

    const now = Date.now();
    const dueRep = new Set(repItems({t: 'c', dueOnly: true}).map(x => x.id));
    const isKnown = k => D.cards[k.id] && D.cards[k.id].k;
    if (mode === 'new') pool = pool.filter(k => !isKnown(k));
    let order;
    if (mode === 'mix') order = shuffle(pool).slice(0, 20);
    else {
      const a = pool.filter(k => dueRep.has(k.id)), b = pool.filter(k => !dueRep.has(k.id) && !isKnown(k)), d = pool.filter(k => !dueRep.has(k.id) && isKnown(k));

  function answerText(q) {
    if (q.ty === 'mc') return mdi(q.o[q.a]);

    return esc(q.a[0].charAt(0).toUpperCase() + q.a[0].slice(1));

  function parseNum(str) {
    let s = String(str).trim().replace(/[\s ]/g, '').replace(/[−–]/g, '-').replace(/^[≈~=]+/, '');
    let isPct = false;
    if (s.endsWith('%')) { isPct = true; s = s.slice(0, -1); }
    s = s.replace(/(€|eur|euro|g|ml|kn|s|km\/h)$/i, '');
    if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(',', '.');
    let v;
    const num = '[-+]?(?:\\d+\\.?\\d*|\\.\\d+)(?:e[-+]?\\d+)?';
    if (new RegExp('^' + num + '/' + num + '$', 'i').test(s)) { const [a, b] = s.split('/'); v = parseFloat(a) / parseFloat(b); }
    else if (new RegExp('^' + num + '$', 'i').test(s)) v = parseFloat(s);
    else return null;
    if (!isFinite(v)) return null;
    if (isPct) v /= 100;
    return {v, isPct};
  }
  function checkNum(q, str) {
    const r = parseNum(str); if (!r) return null;
    const a = q.a;
    const ok = v => {
      if (q.tol === 0) return Math.abs(v - a) < 1e-9 * Math.max(1, Math.abs(a));
      const tol = Math.abs(a) * q.tol / 100;
      return Math.abs(v - a) <= tol + 1e-12 || (q.p && Math.abs(v - a) <= 0.00005);
    };
    if (ok(r.v)) return true;
    if (q.p && !r.isPct && Math.abs(r.v) > 1 && Math.abs(r.v) <= 100 && ok(r.v / 100)) return true;
    return false;
  }
  const normT = s => s.toLowerCase().trim().replace(/^(der|die|das|ein|eine|einen)\s+/, '').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9α-ωΩ]/g, '');
  function checkTxt(q, str) { const u = normT(str); if (!u) return null; return q.a.some(a => normT(a) === u); }

  /* Frage darstellen (auch im Spielmodus genutzt). onDone(ok) wird nach der Bewertung aufgerufen. */
  function questionHTML(q, state, opts = {}) {
    const src = `<div class="q-src"><span class="pill">${esc(SHORT[q.c])}</span><span class="pill ${examOf(q.src) ? 'acc' : ''}">${esc(q.src)}</span>${D.rep[q.id] ? '<span class="pill warn">↻ Wiederholung</span>' : ''}</div>`;
    let body = '';
    if (q.ty === 'mc') {
      body = `<div class="opts">${state.order.map((oi, k) => `<button class="opt" data-act="mc" data-o="${oi}"><span class="k">${'ABCDEF'[k]}</span><span class="ot">${mdi(q.o[oi])}</span></button>`).join('')}</div>`;
    } else if (q.ty === 'num') {
      body = `<div class="num-in"><input id="ans" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="Zahl eingeben" aria-label="Antwort"><button class="btn" data-act="check">Prüfen</button></div>
        <div class="num-meta">${q.u ? `<span class="pill">${esc(q.u)}</span>` : ''}<span class="pill">${q.tol === 0 ? 'exakter Wert' : 'Toleranz ±' + String(q.tol).replace('.', ',') + ' %'}</span>${q.p ? '<span class="pill">auch in % möglich</span>' : ''}</div>`;
    } else {
      body = `<div class="num-in"><input id="ans" type="text" autocomplete="off" autocapitalize="off" enterkeyhint="done" placeholder="Begriff eingeben" aria-label="Antwort"><button class="btn" data-act="check">Prüfen</button></div>`;
    }
    const giveUp = q.ty !== 'mc' && !opts.fast ? '<button class="btn ghost" data-act="giveup">Weiß ich nicht – Lösung zeigen</button>' : '';
    return `<div class="q-card" id="qcard">${src}<div class="q-text content">${md(q.q)}</div>${body}${giveUp}<div id="fb"></div></div>`;
  }
  function mountQuestion(q, state, onDone, opts = {}) {
    let answered = false;
    const finish = (ok, given) => {
      if (answered) return; answered = true;
      if (q.ty === 'mc') {
        $$('.opt', view).forEach(b => { b.disabled = true; const o = +b.dataset.o; if (o === q.a) b.classList.add('correct'); else if (o === given) b.classList.add('wrong'); });
      } else { const inp = $('#ans'); if (inp) inp.disabled = true; const cb = view.querySelector('[data-act="check"]'); if (cb) cb.disabled = true; const gu = view.querySelector('[data-act="giveup"]'); if (gu) gu.remove(); }
      vibrate(ok ? 15 : [25, 40, 25]);
      if (!opts.fast) {
        $('#fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'bad'}"><div class="fh">${ok ? '✓ Richtig!' : '✗ Leider falsch'}</div>${ok && q.ty === 'mc' ? '' : `<div class="small">Richtige Antwort: <b>${answerText(q)}</b></div>`}</div>
          ${q.s ? `<div class="solution"><div class="lbl">Musterlösung / Lösungsweg</div><div class="content">${md(q.s)}</div></div>` : ''}`;
      }
      onDone(ok);
    };
    actions.mc = d => finish(+d.o === q.a, +d.o);
    actions.check = () => {
      const inp = $('#ans'); const v = inp.value;
      const r = q.ty === 'num' ? checkNum(q, v) : checkTxt(q, v);
      if (r === null) { toast(q.ty === 'num' ? 'Bitte eine Zahl eingeben (z. B. 0,25 · 25 % · 1/4)' : 'Bitte eine Antwort eingeben'); inp.focus(); return; }
      finish(r);
    };
    actions.giveup = () => finish(false);
    const inp = $('#ans');
    if (inp) { inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); actions.check(); } }); if (opts.focus) setTimeout(() => inp.focus({preventScroll: true}), 60); }
  }

  function renderQuestionItem(it) {
    const q = QM[it.id];
    const st = it.state || (it.state = {order: q.ty === 'mc' ? shuffle(q.o.map((_, i) => i)) : null});
    const prog = Math.round(100 * SES.i / SES.items.length);

    view.innerHTML = `
      <div class="q-head"><span class="small muted">Frage ${SES.i + 1} von ${SES.items.length}</span><span class="pill ok">✓ ${okCount}</span></div>
      <div class="progress" style="margin-bottom:12px"><i style="width:${prog}%"></i></div>
      ${questionHTML(q, st)}
      <div id="nextWrap"></div>`;
    mountQuestion(q, st, ok => {
      const r = qResult(q.id, ok);
      SES.res.push({t: 'q', id: q.id, ok});
      if (r === 'gemeistert') toast('Gemeistert – aus dem Wiederholen-Stapel entfernt ✓');
      else if (!ok) toast('In den Wiederholen-Stapel gelegt ↻');
      $('#nextWrap').innerHTML = `<div class="sticky-next"><button class="btn" data-act="next">${SES.i + 1 < SES.items.length ? 'Weiter →' : 'Auswertung ansehen'}</button></div>`;
      actions.next = () => sessionNext();
    });
  }

  function ring(ratio) {
    const r = 64, c = 2 * Math.PI * r, col = ratio >= .8 ? 'var(--ok)' : ratio >= .5 ? 'var(--warn)' : 'var(--bad)';
    return `<div class="result-ring"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" stroke="var(--surface2)" stroke-width="14" fill="none"/><circle cx="75" cy="75" r="${r}" stroke="${col}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${c * ratio} ${c}"/></svg><div class="val">${Math.round(ratio * 100)} %</div></div>`;
  }
  function sessionEnd() {
    const res = SES.res;

    const label = SES.kind === 'cards' ? ['gewusst', 'nochmal'] : ['richtig', 'falsch'];
    view.innerHTML = `

        ${uniqWrong.length ? `<div class="small muted" style="margin-top:6px">${plural(uniqWrong.length, 'Eintrag liegt', 'Einträge liegen')} jetzt im Wiederholen-Stapel.</div>` : ''}
      </div>
      <div class="stack">
        ${uniqWrong.length && SES.kind === 'quiz' ? '<button class="btn" data-act="redo">↻ Falsche sofort wiederholen</button>' : ''}
        ${uniqWrong.length && SES.kind !== 'quiz' ? '<button class="btn" data-act="rep">↻ Wiederholen-Stapel starten</button>' : ''}
        <button class="btn secondary" data-act="again">Neue Runde</button>
        <button class="btn ghost" data-act="back">Zurück</button>
      </div>
      ${uniqWrong.length ? `<h2>Zum Nacharbeiten</h2>${uniqWrong.map(r => { const o = r.t === 'c' ? CARD[r.id] : QM[r.id]; return `<details class="acc"><summary><span class="pill bad">${r.t === 'c' ? 'Karte' : 'Frage'}</span><span class="grow small">${mdi(r.t === 'c' ? o.f : o.q.split('\n')[0])}</span></summary><div class="acc-body content">${r.t === 'c' ? md(o.b) : `<p><b>Antwort:</b> ${answerText(o)}</p>` + md(o.s)}</div></details>`; }).join('')}` : ''}`;
    const s = SES;
    actions.redo = () => startQuiz({ids: uniqWrong.map(r => r.id)});
    actions.rep = () => startRepeat();
    actions.again = () => {
      if (s.kind === 'quiz') startQuiz({mode: s.mode, c: s.c, exam: s.exam});
      else if (s.kind === 'cards') startCards({c: s.back.params.c || null, mode: 'all'});
      else startRepeat();
    };

  }

  /* ---------- Quiz-Tab ---------- */
  VIEWS.quiz = () => {

        <button class="list-item" data-act="exam" data-e="${esc(e)}"><span class="ic">📄</span><span class="grow"><b>${esc(e)}</b><br><span class="small muted">${qs.length} Fragen · ${ok} zuletzt richtig</span></span>${chev}</button>`; }).join('')}

      ${D.hist.length ? `<h2>Letzte Runden</h2><div class="card">${D.hist.slice(0, 6).map(h => `<div class="setting"><span class="small">${esc(h.t)}<br><span class="tiny muted">${new Date(h.d).toLocaleString('de-DE', {dateStyle: 'short', timeStyle: 'short'})}</span></span><span class="pill ${h.r / h.n >= .8 ? 'ok' : h.r / h.n >= .5 ? 'warn' : 'bad'}">${h.r}/${h.n}</span></div>`).join('')}</div>` : ''}`;
    actions.n = d => { D.settings.n = d.v === 'all' ? 'all' : +d.v; save(); render('quiz'); };
    actions.mix = () => startQuiz({mode: 'mix'});

    actions.exam = d => go('exam', {exam: d.e});

  };

  VIEWS.exam = ({exam}) => {

  /* ---------- Spiel ---------- */
  VIEWS.game = () => {
    setTop('Spielmodus', 'Punkte, Serien & Zeitrennen', false);
    const gc = D.settings.gc || '';
    view.innerHTML = `
      <div class="card hs-card"><span class="emo">🏆</span><div class="grow"><div class="small muted">Deine Rekorde</div>
        <div class="kv" style="margin-top:6px"><span>Serien-Modus (Punkte)</span><span>${D.hi.streakPts || 0}</span><span>Längste Serie richtig</span><span>${D.hi.streak || 0}</span><span>Zeitrennen (60 s)</span><span>${D.hi.race || 0}</span></div></div></div>
      <div class="small muted" style="margin:14px 2px 6px">Themen</div>
      <div class="chips"><button class="chip ${!gc ? 'on' : ''}" data-act="gc" data-c="">Alle Kapitel</button>${CH.map(c => `<button class="chip ${gc === c.id ? 'on' : ''}" data-act="gc" data-c="${c.id}">${c.ic} ${esc(SHORT[c.id])}</button>`).join('')}</div>
      <div class="mode-grid" style="margin-top:8px">

        <button class="list-item" data-act="race"><span class="ic">⏱️</span><span class="grow"><b>Zeitrennen</b><br><span class="small muted">So viele Multiple-Choice-Fragen wie möglich in 60 Sekunden</span></span>${chev}</button>
      </div>
      <div class="card small muted" style="margin-top:6px">Punkte im Serien-Modus: 10 × Multiplikator (×2 ab 3 richtigen in Folge, ×3 ab 6, ×4 ab 10). Falsche Antworten landen automatisch im Wiederholen-Stapel.</div>`;
    actions.gc = d => { D.settings.gc = d.c; save(); render('game'); };
    actions.streak = () => startStreak();
    actions.race = () => startRace();
  };
  const gamePool = (onlyMc) => { const gc = D.settings.gc || ''; return QS.filter(q => (!gc || q.c === gc) && (onlyMc ? q.ty === 'mc' : q.ty !== 'txt')); };
  const mult = s => s >= 10 ? 4 : s >= 6 ? 3 : s >= 3 ? 2 : 1;
  function startStreak() {
    const pool = shuffle(gamePool(false));
    if (!pool.length) { toast('Keine Fragen für diese Auswahl'); return; }
    GAME = {kind: 'streak', pool, i: 0, lives: 3, streak: 0, best: 0, pts: 0, n: 0, ok: 0, ts: Date.now()};
    go('play', {g: GAME.ts, tab: 'game'});
  }
  function startRace() {
    const pool = shuffle(gamePool(true));
    if (pool.length < 3) { toast('Zu wenige Multiple-Choice-Fragen für diese Auswahl'); return; }
    GAME = {kind: 'race', pool, i: 0, score: 0, wrong: [], end: 0, ts: Date.now(), started: false};
    go('play', {g: GAME.ts, tab: 'game'});
  }
  VIEWS.play = ({g}) => {

    setNav('game');

  };
  function playStreak() {
    const G = GAME;
    if (G.lives <= 0) return streakOver();
    if (G.i >= G.pool.length) { G.pool = G.pool.concat(shuffle(G.pool)); }
    const q = G.pool[G.i];

      <div class="game-hud">

        <div class="hud-box"><b>${'❤️'.repeat(G.lives)}${'🤍'.repeat(3 - G.lives)}</b><span>Leben</span></div>
      </div>
      ${questionHTML(q, st)}

    mountQuestion(q, st, ok => {

      if (ok) { G.streak++; G.ok++; G.best = Math.max(G.best, G.streak); const gain = 10 * mult(G.streak); G.pts += gain; $('#hudPts').textContent = G.pts; $('#hudPts').classList.add('pop'); $('#hudStreak').textContent = '🔥 ' + G.streak; toast('+' + gain + ' Punkte'); $('#qcard').classList.add('flash-ok'); }
      else { G.lives--; G.streak = 0; $('#qcard').classList.add('flash-bad'); }
      G.i++;
      $('#nextWrap').innerHTML = `<div class="sticky-next"><button class="btn" data-act="next">${G.lives > 0 ? 'Nächste Frage →' : 'Spiel beenden'}</button></div>`;
      actions.next = () => { playStreak(); window.scrollTo(0, 0); };
    }, {focus: false});
  }
  function streakOver() {
    const G = GAME;
    const recPts = G.pts > (D.hi.streakPts || 0), recStreak = G.best > (D.hi.streak || 0);
    if (recPts) D.hi.streakPts = G.pts; if (recStreak) D.hi.streak = G.best;

      <div class="card" style="text-align:center">

    actions.again = () => startStreak();
    actions.rep = () => startRepeat({t: 'q'});

  }
  function playRace() {
    const G = GAME;
    setTop('Zeitrennen', '60 Sekunden', true);
    if (!G.started) {
      view.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:3rem">⏱️</div><div style="font-size:1.2rem;font-weight:750">Bereit?</div><p class="muted">60 Sekunden, nur Multiple Choice. Jede richtige Antwort = 1 Punkt. Falsche Antworten kosten Zeit (−3 s).</p><p class="small">Rekord: <b>${D.hi.race || 0}</b></p></div><button class="btn" data-act="go">Los geht's!</button>`;
      actions.go = () => { G.started = true; G.end = Date.now() + 60000; raceQ(); tick(); };
      return;
    }
    raceQ();
  }
  let raceTimer = null;
  function tick() {
    clearInterval(raceTimer);
    raceTimer = setInterval(() => {
      if (!GAME || GAME.kind !== 'race' || current.name !== 'play') { clearInterval(raceTimer); return; }
      const left = Math.max(0, GAME.end - Date.now());
      const tb = $('#tbar'), tl = $('#tleft');
      if (tb) tb.style.width = (left / 600) + '%';
      if (tl) tl.textContent = Math.ceil(left / 1000);
      if (left <= 0) { clearInterval(raceTimer); raceOver(); }
    }, 100);
    cleanup = () => clearInterval(raceTimer);
  }
  function raceQ() {
    const G = GAME;
    if (G.i >= G.pool.length) G.pool = G.pool.concat(shuffle(G.pool));
    const q = G.pool[G.i];
    const st = {order: shuffle(q.o.map((_, i) => i))};
    const left = Math.max(0, G.end - Date.now());
    view.innerHTML = `
      <div class="game-hud"><div class="hud-box"><b id="tleft">${Math.ceil(left / 1000)}</b><span>Sekunden</span></div><div class="hud-box"><b id="rscore">${G.score}</b><span>Punkte</span></div><div class="hud-box"><b>${D.hi.race || 0}</b><span>Rekord</span></div></div>
      <div class="timer"><i id="tbar" style="width:${left / 600}%"></i></div>
      ${questionHTML(q, st, {fast: true})}`;
    mountQuestion(q, st, ok => {
      qResult(q.id, ok);
      if (ok) { G.score++; $('#qcard').classList.add('flash-ok'); }
      else { G.wrong.push(q.id); G.end -= 3000; $('#qcard').classList.add('flash-bad'); }
      G.i++;
      setTimeout(() => { if (GAME === G && current.name === 'play' && Date.now() < G.end) raceQ(); }, ok ? 280 : 650);
    }, {fast: true});
    if (!raceTimer || !cleanup) tick();
  }
  function raceOver() {
    const G = GAME; if (G.over) return; G.over = true;
    const rec = G.score > (D.hi.race || 0);
    if (rec) D.hi.race = G.score; save();
    setTop('Zeitrennen', 'Zeit abgelaufen', true);
    const wrong = [...new Set(G.wrong)];
    view.innerHTML = `
      <div class="card" style="text-align:center"><div style="font-size:3rem">${rec ? '🏆' : '⏱️'}</div><div style="font-size:1.3rem;font-weight:800">${rec ? 'Neuer Rekord!' : 'Zeit abgelaufen'}</div>
      <div style="font-size:2.4rem;font-weight:800;margin:6px 0">${G.score}</div><div class="muted">Punkte · Rekord ${D.hi.race}</div></div>
      <div class="stack"><button class="btn" data-act="again">Nochmal</button><button class="btn ghost" data-act="back">Zurück</button></div>
      ${wrong.length ? `<h2>Falsch beantwortet <span class="sub">→ Wiederholen-Stapel</span></h2>${wrong.map(id => { const q = QM[id]; return `<details class="acc"><summary><span class="grow small">${mdi(q.q.split('\n')[0])}</span></summary><div class="acc-body content"><p><b>Antwort:</b> ${answerText(q)}</p>${md(q.s)}</div></details>`; }).join('')}` : ''}`;
    actions.again = () => startRace();
    actions.back = () => go('game', {}, true);
  }

  /* ---------- Formeln ---------- */
  function erfc(x) { const z = Math.abs(x); const t = 1 / (1 + 0.5 * z); const r = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 + t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277))))))))); return x >= 0 ? r : 2 - r; }
  const Phi = z => 0.5 * erfc(-z / Math.SQRT2);
  const PhiInv = p => { if (!(p > 0 && p < 1)) return NaN; let lo = -12, hi = 12; for (let k = 0; k < 90; k++) { const m = (lo + hi) / 2; if (Phi(m) < p) lo = m; else hi = m; } return (lo + hi) / 2; };
  const fmtTbl = (v, d) => (d === undefined ? String(v) : Number(v).toFixed(d)).replace('.', ',');
  VIEWS.formulas = ({c = ''} = {}) => {
    setTop('Formelsammlung', FO.length + ' Formeln · durchsuchbar', !!c);
    let filt = c || '';
    view.innerHTML = `
      <div class="search"><input id="fsearch" type="search" placeholder="Formel suchen, z. B. Varianz, Bayes, Poisson …" autocomplete="off" aria-label="Formeln durchsuchen"></div>
      <div class="chips" id="fchips"><button class="chip ${!filt ? 'on' : ''}" data-act="fc" data-c="">Alle</button>${CH.map(ch => `<button class="chip ${filt === ch.id ? 'on' : ''}" data-act="fc" data-c="${ch.id}">${ch.ic} ${esc(SHORT[ch.id])}</button>`).join('')}</div>
      <details class="acc" id="tools"><summary>🧮 Tabellen & Rechner <span class="pill" style="margin-left:6px">Φ, z, t, χ²</span></summary><div class="acc-body" id="toolsBody"></div></details>
      <div id="flist"></div>`;
    const list = $('#flist');
    const draw = () => {
      const qv = ($('#fsearch').value || '').toLowerCase().trim();
      const words = qv.split(/\s+/).filter(Boolean);
      const items = FO.filter(f => (!filt || f.c === filt) && words.every(w => (f.n + ' ' + f.k + ' ' + f.tex + ' ' + (f.note || '') + ' ' + CHM[f.c].t).toLowerCase().includes(w)));
      if (!items.length) { list.innerHTML = '<div class="empty">Keine passende Formel gefunden.</div>'; return; }
      let html = '', last = null;
      for (const f of items) {
        if (f.c !== last) { html += `<div class="f-group">${CHM[f.c].ic} ${esc(CHM[f.c].t)}</div>`; last = f.c; }
        html += `<div class="f-item"><div class="fn"><span>${esc(f.n)}</span></div>${mblock(f.tex)}${f.note ? `<div class="note">${md(f.note)}</div>` : ''}</div>`;
      }
      list.innerHTML = html;
    };
    draw();
    let tmr = null;
    $('#fsearch').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(draw, 120); });
    actions.fc = d => { filt = d.c; $$('#fchips .chip').forEach(b => b.classList.toggle('on', b.dataset.c === filt)); draw(); };
    $('#tools').addEventListener('toggle', () => { if ($('#tools').open && !$('#toolsBody').innerHTML) $('#toolsBody').innerHTML = toolsHTML(); bindTools(); }, {once: false});
  };
  function toolsHTML() {
    const T = TABLES;
    return `
      <div class="tool-h" style="margin-top:0">Standardnormalverteilung</div>
      <div class="calc"><div><label for="zin">z eingeben</label><input id="zin" inputmode="decimal" value="1,96"></div><div><label>Φ(z)</label><div class="out" id="zout"></div></div>
      <div><label for="pin">p eingeben</label><input id="pin" inputmode="decimal" value="0,975"></div><div><label>Quantil z<sub>p</sub></label><div class="out" id="pout"></div></div></div>
      <div class="tool-h">Wichtige z-Quantile</div>
      <div class="tblwrap"><table class="tbl qtbl"><tr><th>p</th>${T.z.map(r => `<td>${fmtTbl(r[0])}</td>`).join('')}</tr><tr><th>z<sub>p</sub></th>${T.z.map(r => `<td>${fmtTbl(r[1], 4)}</td>`).join('')}</tr></table></div>
      <div class="tool-h">t-Verteilung: Quantile t<sub>m;p</sub></div>
      <div class="tblwrap"><table class="tbl qtbl"><tr><th>m \\ p</th>${T.tp.map(p => `<th>${fmtTbl(p)}</th>`).join('')}</tr>${T.t.map(r => `<tr><th>${r[0]}</th>${r.slice(1).map(v => `<td>${fmtTbl(v, 3)}</td>`).join('')}</tr>`).join('')}</table></div>
      <div class="tiny muted">Für m > 39: t<sub>m;p</sub> ≈ z<sub>p</sub>(1 + (1+z<sub>p</sub>²)/(4m)); t<sub>m;1−p</sub> = −t<sub>m;p</sub></div>
      <div class="tool-h">χ²-Verteilung: Quantile χ²<sub>m;p</sub></div>
      <div class="tblwrap"><table class="tbl qtbl"><tr><th>m \\ p</th>${T.cp.map(p => `<th>${fmtTbl(p)}</th>`).join('')}</tr>${T.c.map(r => `<tr><th>${r[0]}</th>${r.slice(1).map(v => `<td>${fmtTbl(v, 3)}</td>`).join('')}</tr>`).join('')}</table></div>
      <div class="tiny muted">Werte numerisch berechnet; in der Klausur gelten die Tabellen der Vorlesung.</div>`;
  }
  function bindTools() {
    const zin = $('#zin'), pin = $('#pin'); if (!zin || zin.dataset.b) return; zin.dataset.b = 1;
    const up = () => {
      const z = parseFloat(zin.value.replace(',', '.').replace('−', '-'));
      $('#zout').textContent = isFinite(z) ? Phi(z).toFixed(5).replace('.', ',') : '–';
      const p = parseFloat(pin.value.replace(',', '.'));
      $('#pout').textContent = p > 0 && p < 1 ? PhiInv(p).toFixed(4).replace('.', ',') : '0 < p < 1';
    };
    zin.addEventListener('input', up); pin.addEventListener('input', up); up();
  }

  /* ---------- Statistik & Einstellungen ---------- */
  VIEWS.stats = () => {
    setTop('Statistik & Einstellungen', '', true);
    const t = totals(), rc = repCounts();
    const th = D.settings.theme || 'auto';
    view.innerHTML = `
      <div class="card"><div class="kv">
        <span>Karteikarten gelernt</span><span>${t.known} / ${t.cards}</span>
        <span>Quizantworten gesamt</span><span>${t.r + t.w}</span>
        <span>Davon richtig</span><span>${t.acc === null ? '–' : Math.round(100 * t.acc) + ' %'}</span>
        <span>Wiederholen-Stapel</span><span>${rc.all} (${rc.due} fällig)</span>
        <span>Aus dem Stapel gemeistert</span><span>${D.mastered || 0}</span>
        <span>Lerntage in Folge</span><span>${dayStreak()}</span>
        <span>Lerntage insgesamt</span><span>${D.days.count || 0}</span>
        <span>Rekord Serien-Modus</span><span>${D.hi.streakPts || 0} P.</span>
        <span>Rekord Zeitrennen</span><span>${D.hi.race || 0}</span>
      </div></div>
      <h2>Darstellung</h2>
      <div class="seg">${[['auto', 'Automatisch'], ['light', 'Hell'], ['dark', 'Dunkel']].map(([k, l]) => `<button class="${th === k ? 'on' : ''}" data-act="theme" data-v="${k}">${l}</button>`).join('')}</div>
      <h2>Inhalt der App</h2>
      <div class="card small"><div class="kv"><span>Kapitel</span><span>${CH.length}</span><span>Karteikarten</span><span>${CARDS.length}</span><span>Beispiele & Aufgaben</span><span>${EXS.length}</span><span>Quizfragen</span><span>${QS.length}</span><span>Formeln</span><span>${FO.length}</span></div>
      <p class="muted" style="margin:12px 0 0">Grundlage: Vorlesungsfolien 1–10 (Prof. Dr. P. Breuning, DHSN), Lernliste, Lernzusammenfassung, Klausuren 12/2024 bis 03/2026 und Probeklausur. Alle Lösungen wurden nachgerechnet.</p></div>
      <details class="acc"><summary>⚠ Korrekturhinweise zu den Unterlagen</summary><div class="acc-body content small">${md(FIXES)}</div></details>
      <h2>Daten</h2>
      <div class="stack">
        <button class="btn secondary" data-act="clearrep">Wiederholen-Stapel leeren</button>
        <button class="btn bad" data-act="reset">Gesamten Fortschritt zurücksetzen</button>
      </div>
      <p class="tiny muted" style="text-align:center;margin-top:14px">${storageOK ? 'Gespeichert im localStorage dieses Browsers. Die App funktioniert komplett offline.' : 'localStorage ist in diesem Browser nicht verfügbar.'}</p>`;
    actions.theme = d => { D.settings.theme = d.v; save(); applyTheme(); render('stats'); };
    actions.clearrep = () => { if (confirm('Wiederholen-Stapel wirklich leeren?')) { D.rep = {}; save(); render('stats'); toast('Stapel geleert'); } };
    actions.reset = () => { if (confirm('Wirklich den gesamten Lernfortschritt, alle Quiz-Ergebnisse und Highscores löschen?')) { D = fresh(); save(); toast('Fortschritt zurückgesetzt'); go('home', {}, true); } };
  };

  function applyTheme() {
    const t = D.settings.theme || 'auto';
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  }
  function detectMathML() {
    try {
      const d = document.createElement('div');
      d.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;font-size:20px';
      d.innerHTML = '<math display="block"><mfrac><mn id="mm1">1</mn><mn id="mm2">2</mn></mfrac></math>';
      document.body.appendChild(d);
      const r1 = d.querySelector('#mm1').getBoundingClientRect(), r2 = d.querySelector('#mm2').getBoundingClientRect();
      d.remove();
      const ok = r1.height > 0 && r2.top >= r1.bottom - 2;
      if (!ok) document.documentElement.classList.add('nomml');
    } catch (e) { document.documentElement.classList.add('nomml'); }
  }

  /* ---------- Start ---------- */
  applyTheme();
  detectMathML();
  const start = (history.state && history.state.name && VIEWS[history.state.name] && !['session', 'play'].includes(history.state.name)) ? history.state : {name: 'home', params: {}};
  try { history.replaceState(start, ''); } catch (e) { /* */ }
  render(start.name, start.params);
  if (!storageOK) setTimeout(() => toast('Hinweis: Speichern im Browser nicht möglich'), 600);
  window.__app = {D: () => D, VIEWS, startQuiz, startCards, checkNum, parseNum, go};
  window.__md = md; window.__fit = fitMath;
})();

</script>
</body>
</html>
