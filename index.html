f(x) = \\begin{cases}k\\,e^{-kx} & x>0\\\\ 0 & \\text{sonst}\\end{cases}$$\n$$E(X) = \\frac1k,\\quad \\operatorname{Var}(X) = \\frac{1}{k^2},\\quad \\sigma = \\frac1k,\\quad x_p = -\\frac1k\\ln(1-p)$$"},{"id":"kec5e937c","c":"c6","ty":"Beweis","src":"V5, Folie 18","f":"Herleitung der Kennzahlen der Exponentialverteilung","b":"Partielle Integration:\n$$E(X) = \\int_0^\\infty x\\,k e^{-kx}dx = \\left[-x e^{-kx}\\right]_0^\\infty+\\int_0^\\infty e^{-kx}dx = \\frac1k$$\n$$E(X^2) = \\left[-x^2e^{-kx}\\right]_0^\\infty+\\int_0^\\infty 2x\\,e^{-kx}dx = \\frac2k E(X) = \\frac{2}{k^2}$$\n$\\operatorname{Var}(X) = \\frac{2}{k^2}-\\frac{1}{k^2} = \\frac{1}{k^2}$. Quantil: $1-e^{-kx} = p \\Rightarrow x_p = -\\frac1k\\ln(1-p)$."},{"id":"kb57aca1c","c":"c6","ty":"Beispiel","src":"V5, Folien 20–23","f":"Hypergeometrische Verteilung – Einführung","b":"Urne mit 20 Kugeln (4 blau, 16 rot), 5 Kugeln ohne Zurücklegen. P(genau 2 blaue)?\n$$\\frac{\\binom42\\binom{16}{3}}{\\binom{20}{5}} = \\frac{6\\cdot560}{15\\,504} = \\frac{3360}{15\\,504}\\approx 0,217$$"},{"id":"k5a21e28f","c":"c6","ty":"Definition","src":"V5, Folien 24–25","f":"Hypergeometrische Verteilung $H(n; M; N)$","b":"Grundgesamtheit $N$ Elemente, davon $M$ mit Eigenschaft; Stichprobe $n$ ohne Zurücklegen; $X$ = Anzahl mit Eigenschaft:\n$$P(X=k) = \\frac{\\binom{M}{k}\\binom{N-M}{n-k}}{\\binom{N}{n}},\\quad k = 0, 1, \\dots, \\min\\{n, M\\}$$\nSchreibweise $X\\sim H(n; M; N)$."},{"id":"k2307b7c6","c":"c6","ty":"Merke","src":"V5, Folie 26","f":"Merkregel hypergeometrische Verteilung","b":"$$P = \\frac{\\binom{\\text{Eigenschaft gesamt}}{\\text{Eigenschaft in Probe}}\\cdot\\binom{\\text{ohne Eigenschaft gesamt}}{\\text{ohne Eigenschaft in Probe}}}{\\binom{\\text{Anzahl gesamt}}{\\text{Anzahl Probe}}}$$"},{"id":"k469f2362","c":"c6","ty":"Formel","src":"V5, Folien 27–28","f":"Erwartungswert und Varianz der hypergeometrischen Verteilung","b":"$$E(X) = n\\frac MN,\\qquad \\operatorname{Var}(X) = n\\frac MN\\left(1-\\frac MN\\right)\\frac{N-n}{N-1}$$\nBeispiel $N=20$, $M=4$, $n=5$: $E(X) = 1$, $\\operatorname{Var}(X)\\approx0,63$, $\\sigma\\approx0,79$."},{"id":"k89218248","c":"c6","ty":"Definition","src":"V6, Folie 12","f":"Bernoulli-Experiment und Bernoulli-Kette","b":"Ein Zufallsexperiment mit nur zwei möglichen Ausgängen heißt Bernoulli-Experiment. $n$-malige Ausführung: Bernoulli-Kette der Länge $n$.\nBeispiel: Münzwurf (Kopf/Zahl); 5 Würfe = Bernoulli-Kette der Länge 5."},{"id":"k2170b87d","c":"c6","ty":"Merke","src":"V6, Folie 13","f":"Laplace- vs. Bernoulli-Experiment","b":"- Laplace: endlich viele Ausgänge, alle gleich wahrscheinlich.\n- Bernoulli: nur zwei Ausgänge, nicht zwingend gleich wahrscheinlich.\nWürfel: genaue Augenzahl → Laplace ($\\frac16$ je Zahl); „1 oder nicht 1“ → Bernoulli ($\\frac16$ bzw. $\\frac56$)."},{"id":"k48190491","c":"c6","ty":"Beispiel","src":"V6, Folien 14–16","f":"Binomialverteilung – Einführung","b":"Würfel 7-mal, genau 3-mal die 1? Eine Kette wie 1110000 hat Wahrscheinlichkeit $\\left(\\frac16\\right)^3\\left(\\frac56\\right)^4$, und es gibt $\\binom73$ solche Ketten:\n$$\\binom73\\left(\\frac16\\right)^3\\left(\\frac56\\right)^4\\approx 0,078 = 7,8\\,\\%$$"},{"id":"k2d5316fd","c":"c6","ty":"Definition","src":"V6, Folien 17–18","f":"Binomialverteilung $\\mathrm{Bi}(n; p)$","b":"Bernoulli-Kette der Länge $n$, Ereignis $A$ mit Wahrscheinlichkeit $p$, $q = 1-p$; $X$ = Anzahl der Durchführungen mit $A$:\n$$P(X=k) = \\binom nk p^k q^{n-k},\\quad k = 0, 1, \\dots, n$$\nSchreibweise $X\\sim\\mathrm{Bi}(n; p)$."},{"id":"k93aa6883","c":"c6","ty":"Formel","src":"V6, Folie 19","f":"Erwartungswert und Varianz der Binomialverteilung","b":"$$E(X) = np,\\qquad \\operatorname{Var}(X) = npq = np(1-p)$$"},{"id":"k34e8092d","c":"c6","ty":"Satz","src":"V6, Folien 20–23","f":"Näherung hypergeometrisch → binomial","b":"Ist $N$ deutlich größer als $n$, ändert sich die Ziehungswahrscheinlichkeit kaum. Regel: Gilt grob\n$$n<\\frac{N}{20},$$\nso kann $H(n; M; N)$ durch $\\mathrm{Bi}(n; p)$ mit $p = \\frac MN$ ersetzt werden.\nBemerkungen: Die Binomialverteilung ist rechnerisch bequemer; die Grenze $\\frac N{20}$ ist nicht fest und kann je nach Genauigkeitsanforderung angepasst werden."},{"id":"k7a8edd55","c":"c6","ty":"Definition","src":"V6, Folie 27","f":"Poisson-Verteilung $\\mathrm{Po}(\\lambda)$","b":"Für $\\lambda>0$ nimmt $X$ die Werte $k = 0, 1, 2, \\dots$ an mit\n$$P(X=k) = \\frac{\\lambda^k}{k!}e^{-\\lambda}$$\nModell für seltene Ereignisse in einem festen Intervall (Zeit, Fläche, Volumen). Schreibweise $X\\sim\\mathrm{Po}(\\lambda)$."},{"id":"kcb3842db","c":"c6","ty":"Formel","src":"V6, Folie 28","f":"Erwartungswert und Varianz der Poisson-Verteilung","b":"$$E(X) = \\lambda,\\qquad \\operatorname{Var}(X) = \\lambda$$"},{"id":"k857cbc2f","c":"c6","ty":"Beweis","src":"V6, Folien 28–29","f":"Herleitung von $E(X)$ und $\\operatorname{Var}(X)$ (Poisson)","b":"$$E(X) = \\sum_{k=0}^\\infty k\\frac{\\lambda^k}{k!}e^{-\\lambda} = \\lambda e^{-\\lambda}\\sum_{k=1}^\\infty\\frac{\\lambda^{k-1}}{(k-1)!} = \\lambda e^{-\\lambda}e^{\\lambda} = \\lambda$$\n$$E(X^2) = e^{-\\lambda}\\sum_{k\\ge1}k\\frac{\\lambda^k}{(k-1)!} = e^{-\\lambda}\\left(\\sum_{k\\ge2}\\frac{\\lambda^k}{(k-2)!}+\\sum_{k\\ge1}\\frac{\\lambda^k}{(k-1)!}\\right) = \\lambda^2+\\lambda$$\n$\\operatorname{Var}(X) = \\lambda^2+\\lambda-\\lambda^2 = \\lambda$."},{"id":"k86ae71ad","c":"c6","ty":"Satz","src":"V6, Folien 31–32","f":"Grenzwertsatz Binomial → Poisson","b":"Sei $X\\sim\\mathrm{Bi}(n; p)$. Für $n\\to\\infty$ und $p\\to0$ mit $\\lambda = np$ konstant gilt\n$$\\lim_{n\\to\\infty, p\\to0}P(X=k) = \\frac{\\lambda^k}{k!}e^{-\\lambda},\\quad k = 0, 1, 2, \\dots$$"},{"id":"keb143941","c":"c6","ty":"Satz","src":"V6, Folien 33–34","f":"Regel: Binomial → Poisson","b":"Gilt grob\n$$n>50\\quad\\text{und}\\quad p<0,1,$$\nso kann $\\mathrm{Bi}(n; p)$ durch $\\mathrm{Po}(\\lambda)$ mit $\\lambda = n\\cdot p$ ersetzt werden (Gesetz der seltenen Ereignisse).\nDie Poisson-Verteilung ist rechentechnisch weniger aufwändig; die Grenzen sind nicht fest."},{"id":"kccf2effc","c":"c6","ty":"Tipp","src":"Klausur 19.12.2024, A2","f":"Poisson: Intervall umrechnen und Modus","b":"- Die Rate skaliert mit der Intervalllänge: 6,9 pro Stunde ⇒ $\\lambda = \\frac{6,9}{4} = 1,725$ pro Viertelstunde.\n- Wahrscheinlichste Anzahl (Modus) bei nicht ganzzahligem $\\lambda$: $k = \\lfloor\\lambda\\rfloor$ (denn $\\frac{P(X=k)}{P(X=k-1)} = \\frac\\lambda k$)."},{"id":"kcd714fbd","c":"c6","ty":"Tipp","src":"Klausur 16.12.2025, A4c","f":"Erwartete Anzahl über Indikatorvariablen","b":"Zerlege eine Anzahl in eine Summe von Indikatoren $\\mathbb{1}_{A_i}$ und nutze die Linearität:\n$$E\\left(\\sum_i\\mathbb{1}_{A_i}\\right) = \\sum_i P(A_i)$$\nBeispiel Roulette: erwartete Anzahl verschiedener Zahlen in 37 Spielen $= 37\\left(1-\\left(\\frac{36}{37}\\right)^{37}\\right)\\approx 23,57$."},{"id":"kf8a1c247","c":"c7","ty":"Definition","src":"V7, Folie 2","f":"Normalverteilung (Gauß-Verteilung)","b":"$X$ heißt normalverteilt mit Parametern $\\mu$ und $\\sigma^2$, wenn die Dichte\n$$f(x) = \\frac{1}{\\sigma\\sqrt{2\\pi}}\\,e^{-\\frac12\\left(\\frac{x-\\mu}{\\sigma}\\right)^2}$$\nlautet. Schreibweise $X\\sim N(\\mu; \\sigma^2)$. Der Graph heißt Gaußsche Glockenkurve."},{"id":"kd2c45b70","c":"c7","ty":"Satz","src":"V7, Folie 3","f":"Kennzahlen der Normalverteilung","b":"$$E(X) = \\mu,\\qquad \\operatorname{Var}(X) = \\sigma^2$$\nDie Parameter sind also genau Erwartungswert und (quadrierte) Standardabweichung."},{"id":"k590d309c","c":"c7","ty":"Merke","src":"V7, Folie 4","f":"Verteilungsfunktion der Normalverteilung","b":"$$F(x) = \\frac{1}{\\sigma\\sqrt{2\\pi}}\\int_{-\\infty}^{x}e^{-\\frac12\\left(\\frac{t-\\mu}{\\sigma}\\right)^2}dt$$\nNur numerisch berechenbar. Nach Standardisierung verschwindet die Abhängigkeit von $\\mu, \\sigma$ → Werte aus einer Tabelle ablesen."},{"id":"kf5813e41","c":"c7","ty":"Definition","src":"V7, Folie 5","f":"Standardnormalverteilung","b":"$Z\\sim N(0; 1)$ mit Dichte und Verteilungsfunktion\n$$\\varphi(z) = \\frac{1}{\\sqrt{2\\pi}}e^{-\\frac{z^2}{2}},\\qquad \\Phi(z) = P(Z\\le z) = \\frac{1}{\\sqrt{2\\pi}}\\int_{-\\infty}^{z}e^{-\\frac{t^2}{2}}dt$$"},{"id":"k47bc3276","c":"c7","ty":"Satz","src":"V7, Folien 6–7","f":"Symmetrie von $\\Phi$ und der Quantile","b":"$$\\Phi(-z) = 1-\\Phi(z),\\qquad z_p = -z_{1-p}$$\nDamit reichen Tabellen für $z\\ge0$ bzw. $p\\ge0,5$."},{"id":"k4169a381","c":"c7","ty":"Beispiel","src":"V7, Folie 8","f":"Werte aus der Tabelle ablesen","b":"- $\\Phi(1,28)\\approx0,8997$\n- $\\Phi(-1,71) = 1-\\Phi(1,71)\\approx1-0,9564 = 0,0436$\n- $z_{0,8554}\\approx1,06$\n- $z_{0,3629} = -z_{0,6371}\\approx-0,35$"},{"id":"k20765ca0","c":"c7","ty":"Satz","src":"V7, Folie 9","f":"Linearitätseigenschaft der Normalverteilung","b":"Ist $X\\sim N(\\mu; \\sigma^2)$ und $a\\ne0$, dann ist $Y = aX+b$ wieder normalverteilt mit\n$$E(Y) = a\\mu+b,\\qquad \\operatorname{Var}(Y) = a^2\\sigma^2$$\nBesonderheit: Lineare Transformationen bleiben normalverteilt."},{"id":"k49f0d339","c":"c7","ty":"Satz","src":"V7, Folie 10","f":"Standardisierung der Normalverteilung","b":"$X\\sim N(\\mu; \\sigma^2)$ ⇒ $Z = \\frac{X-\\mu}{\\sigma}\\sim N(0; 1)$ und\n$$F(x) = \\Phi\\left(\\frac{x-\\mu}{\\sigma}\\right),\\quad f(x) = \\frac1\\sigma\\varphi\\left(\\frac{x-\\mu}{\\sigma}\\right),\\quad x_p = \\sigma z_p+\\mu$$"},{"id":"k60286bdd","c":"c7","ty":"Merke","src":"V7, Folie 13","f":"68-95-99,7-Regel","b":"Für $X\\sim N(\\mu; \\sigma^2)$ (nicht nur standardnormalverteilt):\n- $P(\\mu-\\sigma\\le X\\le\\mu+\\sigma)\\approx68,3\\,\\%$\n- $P(\\mu-2\\sigma\\le X\\le\\mu+2\\sigma)\\approx95,5\\,\\%$\n- $P(\\mu-3\\sigma\\le X\\le\\mu+3\\sigma)\\approx99,7\\,\\%$"},{"id":"k4e42889f","c":"c7","ty":"Satz","src":"V7, Folie 14","f":"Additionssatz der Normalverteilung","b":"Sind $X\\sim N(\\mu_X; \\sigma_X^2)$ und $Y\\sim N(\\mu_Y; \\sigma_Y^2)$ unabhängig, dann gilt\n$$X+Y\\sim N(\\mu_X+\\mu_Y; \\sigma_X^2+\\sigma_Y^2)$$\nMit der Linearität folgt auch $Y-X\\sim N(\\mu_Y-\\mu_X; \\sigma_X^2+\\sigma_Y^2)$."},{"id":"k85dfb108","c":"c7","ty":"Satz","src":"V7, Folie 15","f":"Zentraler Grenzwertsatz (ZGS)","b":"$X_1, \\dots, X_n$ unabhängig, identisch verteilt mit $E(X_i) = \\mu$, $\\operatorname{Var}(X_i) = \\sigma^2$; $S = X_1+\\dots+X_n$, $\\bar X = \\frac Sn$. Für\n$$Z = \\frac{S-n\\mu}{\\sqrt n\\,\\sigma} = \\frac{\\bar X-\\mu}{\\sigma/\\sqrt n}$$\ngilt $\\lim_{n\\to\\infty}P(Z\\le z) = \\Phi(z)$.\nDie $X_i$ müssen dafür nicht normalverteilt sein!"},{"id":"ke8bdc433","c":"c7","ty":"Satz","src":"V7, Folie 16","f":"Praktische Anwendung des ZGS","b":"Für großes $n$ ist die Summe $S$ näherungsweise $N(n\\mu; n\\sigma^2)$-verteilt:\n$$P(S\\le x)\\approx\\Phi\\left(\\frac{x-n\\mu}{\\sqrt n\\,\\sigma}\\right)$$"},{"id":"k42bd93b3","c":"c7","ty":"Methode","src":"V7, Folie 17","f":"Stetigkeitskorrektur","b":"Nimmt $S$ nur ganzzahlige Werte an:\n$$P(S\\le x)\\approx\\Phi\\left(\\frac{x+0,5-n\\mu}{\\sqrt n\\,\\sigma}\\right),\\qquad P(S<x)\\approx\\Phi\\left(\\frac{x-0,5-n\\mu}{\\sqrt n\\,\\sigma}\\right)$$\nGrund: Die Approximation wird an den Sprungstellen von $F$ genauer.\nMerke: $P(S\\ge x) = 1-P(S\\le x-1)\\approx1-\\Phi\\left(\\frac{x-0,5-n\\mu}{\\sqrt n\\sigma}\\right)$."},{"id":"k988e3b16","c":"c7","ty":"Satz","src":"V7, Folien 20–21","f":"Näherung der Binomialverteilung durch die Normalverteilung","b":"$X\\sim\\mathrm{Bi}(n; p)$ mit $\\mu = np$, $\\sigma^2 = np(1-p)$:\n$$P(X\\le x)\\approx\\Phi\\left(\\frac{x+0,5-np}{\\sqrt{np(1-p)}}\\right)$$\nRegel: zulässig, wenn $np(1-p)>9$."},{"id":"k3090881a","c":"c7","ty":"Satz","src":"V7, Folie 24","f":"Näherung der Poisson-Verteilung durch die Normalverteilung","b":"$X\\sim\\mathrm{Po}(\\lambda)$ mit $\\mu = \\sigma^2 = \\lambda$:\n$$P(X\\le x)\\approx\\Phi\\left(\\frac{x+0,5-\\lambda}{\\sqrt\\lambda}\\right)$$\nRegel: zulässig, wenn $\\lambda>9$."},{"id":"ka3623645","c":"c7","ty":"Satz","src":"V7, Folie 27","f":"Näherung der hypergeometrischen Verteilung durch die Normalverteilung","b":"$\\mu = n\\frac MN$, $\\sigma^2 = n\\frac MN\\left(1-\\frac MN\\right)\\frac{N-n}{N-1}$:\n$$F_H(x)\\approx\\Phi\\left(\\frac{x+0,5-n\\frac MN}{\\sqrt{n\\frac MN\\left(1-\\frac MN\\right)\\frac{N-n}{N-1}}}\\right)$$\nRegel: verwendbar, wenn $n\\frac MN>4$."},{"id":"k4099e0d6","c":"c7","ty":"Tipp","src":"Klausur 19.03.2025, A3","f":"Stetigkeitskorrektur weglassen?","b":"Ohne ausdrücklichen Hinweis gehört bei ganzzahligen Größen die Stetigkeitskorrektur $\\pm0,5$ dazu.\nSteht in der Aufgabe „Sie können auf die Stetigkeitskorrektur verzichten“, rechnet man direkt mit $\\Phi\\left(\\frac{x-\\mu}{\\sigma}\\right)$."},{"id":"kcc12c71e","c":"c7","ty":"Tipp","src":"Klausurpraxis","f":"Begründung einer Approximation (Klausurformulierung)","b":"- Normal statt Binomial: „Zulässig, da $np(1-p) = \\dots>9$.“\n- Normal statt Poisson: „Zulässig, da $\\lambda = \\dots>9$.“\n- Poisson statt Binomial: „Zulässig, da $n = \\dots>50$ und $p = \\dots<0,1$.“\n- Binomial statt hypergeometrisch: „Zulässig, da $n<\\frac N{20}$.“\n- Normal statt hypergeometrisch: „Zulässig, da $n\\frac MN>4$.“"},{"id":"k6d14f9f6","c":"c7","ty":"Methode","src":"Klausur 16.12.2025, A2 / Probeklausur, A4","f":"Überbuchungsaufgaben lösen","b":"$X\\sim\\mathrm{Bi}(N; p)$ erscheinende Personen, $S$ Plätze. Forderung $P(X\\ge S+1)\\le\\alpha$:\n$$\\frac{S+0,5-Np}{\\sqrt{Np(1-p)}}\\ge z_{1-\\alpha}$$\nNach $N$ gefragt: $u = \\sqrt N$ substituieren → quadratische Gleichung $p\\,u^2+z_{1-\\alpha}\\sqrt{p(1-p)}\\,u-(S+0,5) = 0$ lösen, $N = u^2$ abrunden.\nNach $S$ gefragt: $S\\ge Np+z_{1-\\alpha}\\sqrt{Np(1-p)}-0,5$ aufrunden."},{"id":"k4aa2f80f","c":"c8","ty":"Satz","src":"V8, Folie 17","f":"Tschebyscheff als Werkzeug","b":"Für $X$ mit $E(X) = \\mu$, $\\operatorname{Var}(X) = \\sigma^2$ und beliebiges $c>0$:\n$$P(|X-\\mu|\\ge c)\\le\\frac{\\sigma^2}{c^2}$$\nAnwendung: Abschätzung, wenn nur $E(X)$ und $\\operatorname{Var}(X)$ (nicht die Verteilung) bekannt sind; Grundlage für den Beweis des Gesetzes der großen Zahlen."},{"id":"kdd397ecd","c":"c8","ty":"Satz","src":"V8, Folie 33 / Lernliste Kap. 8","f":"Arithmetisches Mittel als Zufallsvariable","b":"$X_1, \\dots, X_n$ u.i.v. mit Erwartungswert $\\mu$ und Varianz $\\sigma^2$. Dann ist $\\bar X = \\frac1n\\sum_{i=1}^n X_i$ eine Zufallsvariable mit\n$$E(\\bar X) = \\mu,\\qquad \\operatorname{Var}(\\bar X) = \\frac{\\sigma^2}{n}$$\nDie Streuung des Mittelwerts sinkt mit $\\frac1n$ (Standardabweichung mit $\\frac{1}{\\sqrt n}$)."},{"id":"k4cc75238","c":"c8","ty":"Satz","src":"V8, Folie 18","f":"(Schwaches) Gesetz der großen Zahlen","b":"$X_1, \\dots, X_n$ u.i.v. mit Erwartungswert $\\mu$ und Varianz $\\sigma^2$, $\\bar X$ ihr arithmetisches Mittel. Für jedes $\\varepsilon>0$:\n$$\\lim_{n\\to\\infty}P(|\\bar X-\\mu|<\\varepsilon) = 1$$\nMan sagt: $\\bar X$ konvergiert stochastisch gegen $\\mu$."},{"id":"kb9c2c9ee","c":"c8","ty":"Beweis","src":"Lernliste Kap. 8","f":"Beweisidee Gesetz der großen Zahlen","b":"Tschebyscheff auf $\\bar X$ mit $E(\\bar X) = \\mu$, $\\operatorname{Var}(\\bar X) = \\frac{\\sigma^2}{n}$:\n$$P(|\\bar X-\\mu|\\ge\\varepsilon)\\le\\frac{\\sigma^2}{n\\varepsilon^2}\\xrightarrow{n\\to\\infty}0$$\nAlso $P(|\\bar X-\\mu|<\\varepsilon)\\to1$."},{"id":"kc1ccc975","c":"c8","ty":"Definition","src":"V8, Folie 20","f":"Indikatorfunktion","b":"Für $A\\subset\\Omega$ ist $\\mathbb{1}_A:\\Omega\\to\\mathbb{R}$ definiert durch\n$$\\mathbb{1}_A(\\omega) = \\begin{cases}1 & \\omega\\in A\\\\ 0 & \\omega\\notin A\\end{cases}$$\nEs gilt $E(\\mathbb{1}_A) = P(A)$."},{"id":"k12cfd02f","c":"c8","ty":"Satz","src":"V8, Folie 19","f":"Theorem von Bernoulli","b":"Ein Ereignis $A$ mit Wahrscheinlichkeit $p$ wird in einer Bernoulli-Kette $n$-mal unabhängig beobachtet; $f_n$ sei die relative Häufigkeit von $A$. Für jedes $\\varepsilon>0$:\n$$\\lim_{n\\to\\infty}P(|f_n-p|\\le\\varepsilon) = 1$$\nSpezialfall des Gesetzes der großen Zahlen mit $X_i = \\mathbb{1}_A$ (dann $\\bar X = f_n$, $E(X_i) = p$).\nDeutung: Relative Häufigkeiten stabilisieren sich bei der Wahrscheinlichkeit."},{"id":"k4f63b996","c":"c8","ty":"Definition","src":"V8, Folie 21","f":"Empirische Verteilungsfunktion","b":"Für Zufallsvariablen $X_1, \\dots, X_n$ und $x\\in\\mathbb{R}$:\n$$\\hat F_n(x) = \\frac1n\\sum_{i=1}^{n}\\mathbb{1}_{\\{X_i\\le x\\}}$$\n= Anteil der Stichprobenwerte $\\le x$. Für jedes $x$ ist $\\hat F_n(x):\\Omega\\to\\mathbb{R}$ selbst eine Zufallsvariable.\n(Auf den Folien ebenfalls mit $F$ bezeichnet – zur Unterscheidung hier $\\hat F_n$.)"},{"id":"k869ce8ff","c":"c8","ty":"Satz","src":"V8, Folie 22","f":"Hauptsatz der Statistik (Gliwenko-Cantelli)","b":"$X_1, \\dots, X_n$ u.i.v. mit Verteilungsfunktion $F$. Für jedes $\\varepsilon>0$ und jedes $x\\in\\mathbb{R}$:\n$$\\lim_{n\\to\\infty}P\\left(|\\hat F_n(x)-F(x)|<\\varepsilon\\right) = 1$$\nDie empirische Verteilungsfunktion konvergiert stochastisch gegen die wahre Verteilungsfunktion."},{"id":"k4e222ec0","c":"c8","ty":"Merke","src":"Lernzusammenfassung 8","f":"Die drei Konvergenzaussagen im Überblick","b":"- GGZ: $\\bar X_n\\xrightarrow{P}\\mu$\n- Bernoulli: $f_n\\xrightarrow{P}p$\n- Hauptsatz: $\\hat F_n(x)\\xrightarrow{P}F(x)$\n($\\xrightarrow{P}$ = stochastische Konvergenz)"},{"id":"k45edff86","c":"c9","ty":"Begriff","src":"V8, Folien 23–24","f":"Schließende Statistik – Idee","b":"Man möchte Aussagen über eine große Grundgesamtheit (z. B. Bevölkerung, alle Packungen eines Tages) und interessiert sich für ein Merkmal $\\theta$ (z. B. Durchschnittseinkommen, Durchschnittsgewicht).\nProblem: Alle Elemente zu untersuchen ist oft zu aufwändig, zu teuer oder zerstört Produkte.\nIdee: Nur eine Stichprobe nehmen und von ihr auf die Gesamtheit schließen."},{"id":"ked9db906","c":"c9","ty":"Beispiel","src":"V8, Folien 25–28","f":"Beispiel Packungsgewicht","b":"Soll-Gewicht 100 g, Maschine nicht ganz präzise. Das unbekannte Durchschnittsgewicht aller Packungen sei $\\theta$ – dann ist $E(X) = \\theta$ für jede einzelne Packung.\nStichprobe $n = 20$, Gewichte $X_1, \\dots, X_{20}$; Schätzung z. B. durch $\\bar X = \\frac1{20}\\sum X_i$.\nGute Schätzung: Erwartungswert der Schätzung ist $\\theta$, und für große Stichproben liegt der Wert nahe bei $\\theta$."},{"id":"kd8ef035f","c":"c9","ty":"Definition","src":"V8, Folie 29","f":"Zufallsstichprobe","b":"Eine Zufallsstichprobe vom Umfang $n$ ist eine Folge $X_1, \\dots, X_n$ unabhängiger, identisch verteilter Zufallsvariablen. $X_i$ = Ausprägung des $i$-ten Elements; die $X_i$ heißen Stichprobenvariablen."},{"id":"k736d3673","c":"c9","ty":"Definition","src":"V8, Folie 30","f":"Stichprobenfunktion und Schätzfunktion","b":"Eine Funktion $T(X_1, \\dots, X_n)$ der Stichprobenvariablen heißt Stichprobenfunktion; sie ist selbst eine Zufallsvariable.\nWird sie zur Schätzung eines Parameters $\\theta$ verwendet, heißt sie Schätzfunktion (Schätzstatistik, Schätzer) für $\\theta$."},{"id":"k31a0125c","c":"c9","ty":"Merke","src":"Lernliste Kap. 9","f":"Punktschätzung vs. Intervallschätzung","b":"Eine Schätzfunktion liefert eine Punktschätzung – ohne Aussage über die Güte. In der Praxis verwendet man daher meist Intervallschätzungen (Konfidenzintervalle)."},{"id":"k49f327da","c":"c9","ty":"Definition","src":"V8, Folie 32","f":"Erwartungstreue (Unverzerrtheit)","b":"Eine Schätzfunktion $T$ heißt erwartungstreu (unverzerrt), wenn\n$$E(T) = \\theta$$\nBeispiel: $\\bar X$ ist erwartungstreu für $\\mu$, da $E(\\bar X) = \\mu$ (und $\\operatorname{Var}(\\bar X) = \\frac{\\sigma^2}{n}$)."},{"id":"kb3c1657f","c":"c9","ty":"Definition","src":"V8, Folie 34","f":"Konsistenz","b":"$T$ heißt konsistent, wenn $T$ stochastisch gegen $\\theta$ konvergiert:\n$$\\lim_{n\\to\\infty}P(|T-\\theta|<\\varepsilon) = 1\\quad\\text{für jedes }\\varepsilon>0$$"},{"id":"kd26c5a55","c":"c9","ty":"Definition","src":"V8, Folie 35","f":"Konsistenz im quadratischen Mittel","b":"$T$ heißt konsistent im quadratischen Mittel, wenn\n$$\\lim_{n\\to\\infty}E\\left((T-\\theta)^2\\right) = 0$$"},{"id":"k62a58f70","c":"c9","ty":"Satz","src":"V8, Folie 36","f":"Zerlegung des mittleren quadratischen Fehlers","b":"$$E\\left((T-\\theta)^2\\right) = E(T^2)-2\\theta E(T)+\\theta^2 = \\operatorname{Var}(T)+\\left(E(T)-\\theta\\right)^2$$\nKonsistenz im quadratischen Mittel ⇔ sowohl $\\operatorname{Var}(T)\\to0$ als auch Verzerrung $E(T)-\\theta\\to0$."},{"id":"kb9a8fc6c","c":"c9","ty":"Satz","src":"V8, Folie 37","f":"Quadratisches Mittel ⇒ Konsistenz","b":"Ist $T$ konsistent im quadratischen Mittel, so ist $T$ auch konsistent. Die Umkehrung gilt nicht.\nKonsistenz im quadratischen Mittel ist also die stärkere Eigenschaft.\nBeweis: $P(|T-\\theta|\\ge\\varepsilon)\\le\\frac{E((T-\\theta)^2)}{\\varepsilon^2}\\to0$ (Tschebyscheff-/Markov-Argument)."},{"id":"k302b284e","c":"c9","ty":"Beispiel","src":"V8, Folien 38–41","f":"Wichtige Schätzfunktionen","b":"- $\\bar X = \\frac1n\\sum X_i$ für $\\mu$: erwartungstreu und konsistent im quadratischen Mittel\n- $\\bar P = \\frac1n\\sum P_i$ ($P_i\\in\\{0, 1\\}$) für einen Anteil $p$: erwartungstreu und konsistent im quadratischen Mittel\n- Empirische Verteilungsfunktion für $F$: erwartungstreu und konsistent im quadratischen Mittel"},{"id":"kbc16bf08","c":"c9","ty":"Beispiel","src":"V8, Folie 40","f":"Anteilsschätzung: Partei XYZ","b":"1 Million Personen, davon 150 000 (15 %) wählen XYZ – vor der Wahl unbekannt. Befragung von 1000 zufälligen Personen, 135 wählen XYZ:\n$$\\bar P = \\frac{1}{1000}\\sum_{i=1}^{1000}P_i = \\frac{135}{1000} = 13,5\\,\\%$$\nals Schätzwert für die wahren 15 %."},{"id":"kab820c14","c":"c9","ty":"Satz","src":"V8, Folien 42–43","f":"Schätzfunktion für die Varianz","b":"$$S^2 = \\frac{1}{n-1}\\sum_{i=1}^{n}(X_i-\\bar X)^2 = \\frac{1}{n-1}\\sum_{i=1}^{n}X_i^2-\\frac{n}{n-1}\\bar X^2$$\n$S^2$ ist erwartungstreu und konsistent für $\\sigma^2$. Mit $\\frac1n$ statt $\\frac{1}{n-1}$ wäre der Schätzer nicht erwartungstreu."},{"id":"k94e54a30","c":"c9","ty":"Beweis","src":"Lernzusammenfassung 9.3","f":"Beweisidee: $S^2$ ist erwartungstreu","b":"$E(X_i^2) = \\sigma^2+\\mu^2$ und $E(\\bar X^2) = \\operatorname{Var}(\\bar X)+E(\\bar X)^2 = \\frac{\\sigma^2}{n}+\\mu^2$:\n$$E\\left(\\sum(X_i-\\bar X)^2\\right) = E\\left(\\sum X_i^2-n\\bar X^2\\right) = n(\\sigma^2+\\mu^2)-n\\left(\\frac{\\sigma^2}{n}+\\mu^2\\right) = (n-1)\\sigma^2$$\nAlso $E(S^2) = \\sigma^2$."},{"id":"kcf5382ee","c":"c9","ty":"Begriff","src":"V8, Folie 8","f":"Prüfgröße und Prüfverteilungen","b":"Eine Prüfgröße ist eine Vorschrift, nach der aus einer Stichprobe ein neuer Wert berechnet wird (z. B. der Stichprobenmittelwert) – selbst eine Zufallsvariable.\nPrüfverteilungen: Chi-Quadrat-, t- und F-Verteilung."},{"id":"k76857c9c","c":"c9","ty":"Definition","src":"V8, Folie 9","f":"Chi-Quadrat-Verteilung $\\chi^2(m)$","b":"$Z_1, \\dots, Z_m$ unabhängig standardnormalverteilt:\n$$X = Z_1^2+\\dots+Z_m^2\\sim\\chi^2(m)$$\nChi-Quadrat-Verteilung mit $m$ Freiheitsgraden."},{"id":"kead98b0c","c":"c9","ty":"Satz","src":"V8, Folien 10–11","f":"Eigenschaften der χ²-Verteilung","b":"- $E(X) = m$, $\\operatorname{Var}(X) = 2m$\n- Additionseigenschaft: $X_1\\sim\\chi^2(m_1)$, $X_2\\sim\\chi^2(m_2)$ (unabhängig) ⇒ $X_1+X_2\\sim\\chi^2(m_1+m_2)$"},{"id":"k1c9d96d9","c":"c9","ty":"Satz","src":"V9, Folie 23","f":"Näherung der χ²-Quantile ($m>39$)","b":"$$\\chi^2_{m;p}\\approx m\\left(1-\\frac{2}{9m}+z_p\\sqrt{\\frac{2}{9m}}\\right)^3$$\nmit dem p-Quantil $z_p$ der Standardnormalverteilung."},{"id":"kd768ad43","c":"c9","ty":"Definition","src":"V8, Folie 12","f":"t-Verteilung (Student-Verteilung) $t(m)$","b":"$X\\sim\\chi^2(m)$ und $Z\\sim N(0; 1)$ unabhängig:\n$$T = \\frac{Z}{\\sqrt{X/m}}\\sim t(m)$$"},{"id":"k69f10b22","c":"c9","ty":"Satz","src":"V8, Folie 13 / V9, Folie 9","f":"Eigenschaften der t-Verteilung","b":"- Symmetrisch um 0: $E(T) = 0$ für $m>1$ (auf den Folien steht „$E(T) = m$“ – ein Druckfehler; wegen der Symmetrie ist der Erwartungswert 0)\n- $\\operatorname{Var}(T) = \\frac{m}{m-2}$ für $m>2$\n- Für $m = 1$ existiert $E(T)$ nicht, für $m\\le2$ keine Varianz (Integrale divergieren)\n- Quantile: $t_{m;1-p} = -t_{m;p}$"},{"id":"keffb97c3","c":"c9","ty":"Satz","src":"V9, Folie 10","f":"Näherung der t-Quantile ($m>39$)","b":"$$t_{m;p}\\approx z_p\\left(1+\\frac{1+z_p^2}{4m}\\right)$$\nFür großes $m$ gilt $t(m)\\approx N(0; 1)$."},{"id":"k1ce1eadf","c":"c9","ty":"Definition","src":"V8, Folie 14","f":"F-Verteilung (Fisher-Verteilung) $F(m_1; m_2)$","b":"$X_1\\sim\\chi^2(m_1)$, $X_2\\sim\\chi^2(m_2)$ unabhängig:\n$$X = \\frac{X_1/m_1}{X_2/m_2}\\sim F(m_1; m_2)$$"},{"id":"kd8e3c7aa","c":"c9","ty":"Satz","src":"V8, Folie 15 / V9, Folie 33","f":"Eigenschaften der F-Verteilung","b":"$$E(X) = \\frac{m_2}{m_2-2}\\ (m_2>2),\\qquad \\operatorname{Var}(X) = \\frac{2m_2^2(m_1+m_2-2)}{m_1(m_2-4)(m_2-2)^2}\\ (m_2>4)$$\nQuantile (Reihenfolge der Freiheitsgrade vertauschen!):\n$$F_{m_1;m_2;1-p} = \\frac{1}{F_{m_2;m_1;p}}$$"},{"id":"keb2a2bc6","c":"c9","ty":"Satz","src":"V9, Folien 34–35","f":"Näherung der F-Quantile ($m_1, m_2>30$)","b":"Mit $g = \\frac{1}{m_1}-\\frac{1}{m_2}$ und $h = \\frac{2m_1m_2}{m_1+m_2}$:\n$$F_{m_1;m_2;0,95}\\approx\\exp\\left(\\frac{3,2897}{\\sqrt{h-0,95}}-1,568g\\right)$$\n$$F_{m_1;m_2;0,975}\\approx\\exp\\left(\\frac{3,9197}{\\sqrt{h-1,14}}-1,948g\\right)$$"},{"id":"kcd2a64bd","c":"c10","ty":"Definition","src":"V9, Folie 2","f":"Konfidenzintervall","b":"$X_1, \\dots, X_n$ Zufallsstichprobe. Ein aus der Stichprobe berechnetes Intervall $[g_u(X_1, \\dots, X_n), g_o(X_1, \\dots, X_n)]$ mit\n$$P\\left(\\theta\\in[g_u, g_o]\\right) = 1-\\alpha$$\nheißt Konfidenzintervall (Vertrauensintervall, Vertrauensbereich) zum Niveau $1-\\alpha$."},{"id":"k3575be13","c":"c10","ty":"Begriff","src":"V9, Folie 3","f":"Konfidenzniveau und Irrtumswahrscheinlichkeit","b":"- $1-\\alpha$: Konfidenzniveau (Vertrauenswahrscheinlichkeit, Sicherheit)\n- $\\alpha$: Irrtumswahrscheinlichkeit, $P(\\theta\\notin[g_u, g_o]) = \\alpha$"},{"id":"k2cc78f20","c":"c10","ty":"Merke","src":"V9, Folie 4","f":"Betrachtete Fälle von Konfidenzintervallen","b":"- Erwartungswert einer Normalverteilung: $\\sigma$ bekannt / $\\sigma$ unbekannt\n- Erwartungswert einer beliebigen Verteilung bei großem Stichprobenumfang\n- Vergleich zweier Erwartungswerte: $\\sigma$ bekannt / $\\sigma$ unbekannt, aber gleich\n- Varianz bzw. Standardabweichung einer Normalverteilung\n- Anteilswert (großer und beliebiger Stichprobenumfang)"},{"id":"kc525862e","c":"c10","ty":"Methode","src":"V9, Folie 5","f":"KI für µ – Normalverteilung, σ bekannt","b":"1. Konfidenzniveau $1-\\alpha$ festlegen\n2. Stichprobe vom Umfang $n$, $\\bar x$ berechnen\n3. Quantil $z_{1-\\alpha/2}$ der Standardnormalverteilung bestimmen\n$$\\left[\\bar x-z_{1-\\alpha/2}\\frac{\\sigma}{\\sqrt n},\\ \\bar x+z_{1-\\alpha/2}\\frac{\\sigma}{\\sqrt n}\\right]$$"},{"id":"kf08b07ed","c":"c10","ty":"Methode","src":"V9, Folie 12","f":"KI für µ – Normalverteilung, σ unbekannt","b":"1. $1-\\alpha$ festlegen; 2. $\\bar x$ und $s$ berechnen; 3. Quantil $t_{n-1;1-\\alpha/2}$ ($n-1$ Freiheitsgrade)\n$$\\left[\\bar x-t_{n-1;1-\\alpha/2}\\frac{s}{\\sqrt n},\\ \\bar x+t_{n-1;1-\\alpha/2}\\frac{s}{\\sqrt n}\\right]$$\nmit $s = \\sqrt{\\frac{1}{n-1}\\sum(x_i-\\bar x)^2} = \\sqrt{\\frac{1}{n-1}\\sum x_i^2-\\frac{n}{n-1}\\bar x^2}$."},{"id":"k1cc2485d","c":"c10","ty":"Methode","src":"V9, Folie 14","f":"KI für µ – beliebige Verteilung, großes n","b":"Faustregel $n>30$ (ZGS). Quantil $z_{1-\\alpha/2}$:\n$$\\bar x\\pm z_{1-\\alpha/2}\\frac{\\sigma}{\\sqrt n}\\ (\\sigma\\text{ bekannt}),\\qquad \\bar x\\pm z_{1-\\alpha/2}\\frac{s}{\\sqrt n}\\ (\\sigma\\text{ unbekannt})$$\nüberdeckt $\\mu$ mit Wahrscheinlichkeit ca. $1-\\alpha$."},{"id":"ka821331f","c":"c10","ty":"Methode","src":"V9, Folie 16","f":"KI für $\\mu_1-\\mu_2$ – σ₁, σ₂ bekannt","b":"Zwei Stichproben (Umfänge $n_1$, $n_2$, Mittel $\\bar x_1$, $\\bar x_2$), Quantil $z_{1-\\alpha/2}$:\n$$\\left[\\bar x_1-\\bar x_2-z_{1-\\alpha/2}\\sqrt{\\frac{\\sigma_1^2}{n_1}+\\frac{\\sigma_2^2}{n_2}},\\ \\bar x_1-\\bar x_2+z_{1-\\alpha/2}\\sqrt{\\frac{\\sigma_1^2}{n_1}+\\frac{\\sigma_2^2}{n_2}}\\right]$$"},{"id":"k4ba73b2f","c":"c10","ty":"Methode","src":"V9, Folien 17–19","f":"KI für $\\mu_1-\\mu_2$ – σ unbekannt, aber gleich","b":"Mittel $\\bar x_1, \\bar x_2$, Varianzen $s_1^2, s_2^2$, Quantil $t_{n_1+n_2-2;1-\\alpha/2}$:\n$$g_\\pm = \\bar x_1-\\bar x_2\\pm t_{n_1+n_2-2;1-\\alpha/2}\\sqrt{\\frac{n_1+n_2}{n_1n_2}\\cdot\\frac{(n_1-1)s_1^2+(n_2-1)s_2^2}{n_1+n_2-2}}$$\nFür $n_1 = n_2 = n$ vereinfacht: $$\\bar x_1-\\bar x_2\\pm t_{2(n-1);1-\\alpha/2}\\sqrt{\\frac{s_1^2+s_2^2}{n}}$$\nHinweis: Auf Folie 18 steht im Nenner $n_1+n_2-1$ – korrekt ist $n_1+n_2-2$ (wie in der Lernliste)."},{"id":"kd26e2a2b","c":"c10","ty":"Methode","src":"V9, Folien 25–27","f":"KI für σ² bzw. σ – Normalverteilung","b":"$s^2$ berechnen, Quantile $\\chi^2_{n-1;\\alpha/2}$ und $\\chi^2_{n-1;1-\\alpha/2}$:\n$$\\sigma^2\\in\\left[\\frac{(n-1)s^2}{\\chi^2_{n-1;1-\\alpha/2}},\\ \\frac{(n-1)s^2}{\\chi^2_{n-1;\\alpha/2}}\\right]$$\nFür $\\sigma$: Wurzel aus beiden Grenzen. Achtung: Das größere Quantil steht bei der unteren Grenze!"},{"id":"kabd46110","c":"c10","ty":"Methode","src":"V9, Folien 28–30","f":"KI für einen Anteilswert p – großes n","b":"Im Bereich $n>20$, Anteil $\\bar p$ in der Stichprobe, Quantil $z = z_{1-\\alpha/2}$:\n$$g_\\pm = \\frac{n}{n+z^2}\\left(\\bar p+\\frac{z^2}{2n}\\pm z\\sqrt{\\frac{\\bar p(1-\\bar p)}{n}+\\frac{z^2}{4n^2}}\\right)$$\nGilt $n\\bar p(1-\\bar p)>9$, reicht das vereinfachte Intervall\n$$\\left[\\bar p-z\\sqrt{\\frac{\\bar p(1-\\bar p)}{n}},\\ \\bar p+z\\sqrt{\\frac{\\bar p(1-\\bar p)}{n}}\\right]$$"},{"id":"kc99accf2","c":"c10","ty":"Methode","src":"V9, Folien 37–39","f":"KI für einen Anteilswert p – beliebiges n (F-Verteilung)","b":"Anzahl $x$ der Elemente mit Eigenschaft in der Stichprobe vom Umfang $n$:\n$$g_- = \\frac{x}{x+(n-x+1)F_{2(n-x+1);2x;1-\\frac\\alpha2}}$$\n$$g_+ = \\frac{(x+1)F_{2(x+1);2(n-x);1-\\frac\\alpha2}}{n-x+(x+1)F_{2(x+1);2(n-x);1-\\frac\\alpha2}}$$\nHinweis: Auf den Folien steht bei $g_+$ das Quantil zu $\\frac\\alpha2$; korrekt (und so in der Lernliste) ist $1-\\frac\\alpha2$."},{"id":"ked105b54","c":"c10","ty":"Methode","src":"Lernliste Kap. 10","f":"Einseitige Konfidenzintervalle","b":"- Nach oben beschränkt: $I = (-\\infty, b]$\n- Nach unten beschränkt: $I = [a, \\infty)$\nBestimmung: untere bzw. obere Grenze des zweiseitigen Intervalls nehmen und im Quantil $\\frac\\alpha2$ durch $\\alpha$ bzw. $1-\\frac\\alpha2$ durch $1-\\alpha$ ersetzen.\nBeispiel ($\\sigma$ bekannt, nach oben beschränkt): $$\\left(-\\infty,\\ \\bar x+z_{1-\\alpha}\\frac{\\sigma}{\\sqrt n}\\right]$$"},{"id":"k9a25d656","c":"c10","ty":"Methode","src":"Klausur 16.03.2026, A2b","f":"Stichprobenumfang für eine vorgegebene Intervalllänge","b":"Länge des KI ($\\sigma$ bekannt): $L = 2z_{1-\\alpha/2}\\frac{\\sigma}{\\sqrt n}$. Forderung $L\\le L_0$:\n$$n\\ge\\left(\\frac{2z_{1-\\alpha/2}\\,\\sigma}{L_0}\\right)^2$$\nErgebnis immer aufrunden."},{"id":"k87740b82","c":"c10","ty":"Tipp","src":"Klausurpraxis","f":"Welches Konfidenzintervall wann?","b":"- Parameter µ, Normalverteilung, σ gegeben → $z$-Intervall\n- Parameter µ, Normalverteilung, σ nicht gegeben → $t$-Intervall mit $n-1$ FG\n- Parameter µ, Verteilung unbekannt, $n>30$ → $z$-Intervall mit $s$\n- Parameter σ oder σ² → $\\chi^2$-Intervall mit $n-1$ FG\n- Anteil p → Normalnäherung (bei $n\\bar p(1-\\bar p)>9$) oder F-Intervall\nQuantil immer zu $1-\\frac\\alpha2$ (zweiseitig), z. B. 95 % → $z_{0,975} = 1,96$, 99 % → $z_{0,995} = 2,576$."},{"id":"k2f2a3dca","c":"c11","ty":"Definition","src":"V10, Folie 2","f":"Statistisches Testproblem","b":"Ein Testproblem besteht aus einer Nullhypothese $H_0$ und einer Alternativhypothese $H_1$, die sich gegenseitig ausschließen.\nMachen die Hypothesen Aussagen über einen Parameter $\\theta$ der Grundgesamtheit, spricht man von einem parametrischen Test."},{"id":"k12d3722c","c":"c11","ty":"Definition","src":"V10, Folie 2 / Lernliste Kap. 11","f":"Signifikanzniveau α","b":"Die vorher festgelegte (maximale) Wahrscheinlichkeit, $H_0$ fälschlich zu verwerfen, obwohl $H_0$ wahr ist.\nDeutung: Sprechen die Werte für $H_1$ und ist $\\alpha$ klein, dann lassen sich diese Werte kaum durch zufällige Schwankung erklären."},{"id":"k6b2df58b","c":"c11","ty":"Definition","src":"V10, Folien 3–4","f":"Fehler 1. und 2. Art","b":"- Fehler 1. Art (α-Fehler): $H_0$ wird irrtümlich abgelehnt, obwohl $H_0$ wahr ist.\n- Fehler 2. Art (β-Fehler): $H_0$ wird irrtümlich beibehalten, obwohl $H_0$ falsch ist.\n<table class=\"tbl\"><tr><th><\/th><th>Entscheidung für $H_0$<\/th><th>Entscheidung für $H_1$<\/th><\/tr><tr><th>$H_0$ wahr<\/th><td>richtig ($1-\\alpha$)<\/td><td>Fehler 1. Art ($\\alpha$)<\/td><\/tr><tr><th>$H_1$ wahr<\/th><td>Fehler 2. Art ($\\beta$)<\/td><td>richtig ($1-\\beta$, Macht)<\/td><\/tr><\/table>"},{"id":"kf013fb7a","c":"c11","ty":"Definition","src":"V10, Folie 5","f":"Ein- und zweiseitige Testprobleme","b":"- Zweiseitig: $H_0: \\mu = \\mu_0$ gegen $H_1: \\mu\\ne\\mu_0$\n- Einseitig: $H_0: \\mu\\le\\mu_0$ gegen $H_1: \\mu>\\mu_0$ bzw. $H_0: \\mu\\ge\\mu_0$ gegen $H_1: \\mu<\\mu_0$\nMerke: Die Behauptung, die man nachweisen will, gehört in $H_1$."},{"id":"keb364979","c":"c11","ty":"Merke","src":"V10, Folie 6","f":"Übersicht der Testverfahren","b":"- Gauß-Test: µ einer Normalverteilung, σ bekannt\n- t-Test: µ einer Normalverteilung, σ unbekannt\n- χ²-Test: σ² einer Normalverteilung\n- χ²-Anpassungstest: Liegt eine bestimmte Verteilung vor?"},{"id":"k72a5f7f3","c":"c11","ty":"Methode","src":"V10, Folien 7–8","f":"Gauß-Test (σ bekannt)","b":"1. Hypothesen: a) $\\mu = \\mu_0$ vs. $\\mu\\ne\\mu_0$; b) $\\mu\\ge\\mu_0$ vs. $\\mu<\\mu_0$; c) $\\mu\\le\\mu_0$ vs. $\\mu>\\mu_0$\n2. Signifikanzniveau $\\alpha$ wählen\n3. Prüfwert $$z = \\frac{\\bar x-\\mu_0}{\\sigma/\\sqrt n}$$\n4. Quantil: a) $z_{1-\\alpha/2}$; b), c) $z_{1-\\alpha}$\n5. $H_0$ verwerfen, falls a) $|z|>z_{1-\\alpha/2}$; b) $z<-z_{1-\\alpha}$; c) $z>z_{1-\\alpha}$"},{"id":"ke18bed32","c":"c11","ty":"Methode","src":"V10, Folien 10–11","f":"t-Test (σ unbekannt)","b":"1. Hypothesen a), b), c) wie beim Gauß-Test; $\\alpha$ wählen\n2. $\\bar x$, $s$ und Prüfwert $$t = \\frac{\\bar x-\\mu_0}{s/\\sqrt n}$$\n3. Quantil: a) $t_{n-1;1-\\alpha/2}$; b), c) $t_{n-1;1-\\alpha}$\n4. $H_0$ verwerfen, falls a) $|t|>t_{n-1;1-\\alpha/2}$; b) $t<-t_{n-1;1-\\alpha}$; c) $t>t_{n-1;1-\\alpha}$"},{"id":"k5ef95260","c":"c11","ty":"Methode","src":"V10, Folien 12–13","f":"χ²-Test für die Varianz σ²","b":"1. Hypothesen: a) $\\sigma^2 = \\sigma_0^2$ vs. $\\ne$; b) $\\sigma^2\\ge\\sigma_0^2$ vs. $<$; c) $\\sigma^2\\le\\sigma_0^2$ vs. $>$\n2. $s^2$ und Prüfwert $$y = \\frac{n-1}{\\sigma_0^2}s^2$$\n3. Quantile: a) $\\chi^2_{n-1;\\alpha/2}$ und $\\chi^2_{n-1;1-\\alpha/2}$; b) $\\chi^2_{n-1;\\alpha}$; c) $\\chi^2_{n-1;1-\\alpha}$\n4. $H_0$ verwerfen, falls a) $y<\\chi^2_{n-1;\\alpha/2}$ oder $y>\\chi^2_{n-1;1-\\alpha/2}$; b) $y<\\chi^2_{n-1;\\alpha}$; c) $y>\\chi^2_{n-1;1-\\alpha}$"},{"id":"kd1e05485","c":"c11","ty":"Methode","src":"V10, Folien 14–15","f":"χ²-Anpassungstest","b":"1. Zerlegung $A_1, \\dots, A_k$ aller möglichen Werte von $X$ in disjunkte Klassen; $p_i = P(X\\in A_i)$ unter der angenommenen Verteilung\n2. $H_0: P(X\\in A_i) = p_i$ für alle $i$ gegen $H_1$: $\\ne p_i$ für mindestens ein $i$; $\\alpha$ wählen\n3. Stichprobe vom Umfang $n$, Klassenhäufigkeiten $h_i$, Prüfwert\n$$y = \\sum_{i=1}^{k}\\frac{(h_i-np_i)^2}{np_i} = \\frac1n\\sum_{i=1}^{k}\\frac{h_i^2}{p_i}-n$$\n4. $H_0$ verwerfen, falls $y>\\chi^2_{k-1;1-\\alpha}$\n(Werden $r$ Parameter geschätzt: $k-1-r$ Freiheitsgrade, Lernzusammenfassung.)"},{"id":"k3944e912","c":"c11","ty":"Begriff","src":"Lernzusammenfassung 11.3","f":"p-Wert","b":"Die Wahrscheinlichkeit, unter $H_0$ einen mindestens so extremen Prüfwert wie beobachtet zu erhalten – z. B. einseitig links $p = \\Phi(z)$.\n$H_0$ wird genau dann verworfen, wenn $p<\\alpha$. Der p-Wert ist also das kleinste Niveau, ab dem man $H_0$ verwerfen würde."},{"id":"kdccc079a","c":"c11","ty":"Begriff","src":"Lernzusammenfassung 11.1","f":"Macht (Power) eines Tests","b":"$1-\\beta$ = Wahrscheinlichkeit, $H_0$ richtigerweise zu verwerfen, wenn $H_1$ wahr ist.\nBei festem $\\alpha$ steigt die Macht mit dem Stichprobenumfang $n$."}],"ex":[{"id":"e47a7f5f6","c":"c0","src":"V2, Folie 6","t":"Potenzmenge bestimmen","q":"Bestimmen Sie die Potenzmenge von $M=\\{1, 2, 3\\}$ und ihre Mächtigkeit.","s":"$$\\mathcal{P}(M)=\\{\\emptyset, \\{1\\}, \\{2\\}, \\{3\\}, \\{1, 2\\}, \\{1, 3\\}, \\{2, 3\\}, \\{1, 2, 3\\}\\}$$\nAlso $|\\mathcal{P}(M)| = 8 = 2^3$."},{"id":"e313a7380","c":"c0","src":"V2, Folien 13–18","t":"Sinus: injektiv, surjektiv, bijektiv?","q":"Untersuchen Sie $x \\mapsto \\sin x$ auf verschiedenen Definitions- und Zielmengen.","s":"- $\\mathbb{R}\\to[-1, 1]$: surjektiv, nicht injektiv.\n- $\\mathbb{R}\\to\\mathbb{R}$: weder surjektiv (Wert 2 fehlt) noch injektiv ($\\sin 0 = \\sin\\pi = 0$).\n- $[-\\frac{\\pi}{2}, \\frac{\\pi}{2}]\\to\\mathbb{R}$: injektiv, nicht surjektiv.\n- $[-\\frac{\\pi}{2}, \\frac{\\pi}{2}]\\to[-1, 1]$: bijektiv, Umkehrfunktion $\\arcsin$."},{"id":"e3a636da2","c":"c1","src":"V1, Folie 12","t":"Augensumme höchstens 10","q":"Ein fairer Würfel wird zweimal geworfen. Wie groß ist die Wahrscheinlichkeit, dass die Augensumme höchstens 10 ist?","s":"Gegenereignis „Summe $\\ge 11$“: $A^c=\\{(5, 6), (6, 5), (6, 6)\\}$, $|\\Omega| = 36$.\n$$P(A) = 1-\\frac{3}{36} = \\frac{33}{36}=\\frac{11}{12}\\approx 91,67\\,\\%$$"},{"id":"ef349da76","c":"c1","src":"V1, Folie 17","t":"Mensa-Kombinationen","q":"In der Mensa gibt es 2 Vorspeisen, 4 Hauptspeisen und 3 Nachspeisen. Wie viele Kombinationen aus Vor-, Haupt- und Nachspeise gibt es?","s":"Kartesisches Produkt: $2\\cdot 4\\cdot 3 = 24$."},{"id":"ed4fb6364","c":"c1","src":"V1, Folie 8","t":"Ute und die Liebesbriefe","q":"Ute schreibt 4 Liebesbriefe an 4 Freunde und adressiert 4 Umschläge. Ihr kleiner Bruder Paul steckt jeden Brief willkürlich in einen Umschlag. Wie groß ist die Wahrscheinlichkeit, dass mindestens ein Brief den korrekten Adressaten erreicht?","s":"$|\\Omega| = 4! = 24$ Zuordnungen. Gegenereignis: kein Brief richtig (fixpunktfreie Permutation). Das sind $D_4 = 9$ Permutationen (z. B. alle Vertauschungen, bei denen kein Element an seinem Platz bleibt).\n$$P(\\text{mind. einer richtig}) = 1-\\frac{9}{24} = \\frac{15}{24} = 62,5\\,\\%$$\nSiebformel: $\\sum_{k=1}^{4}\\frac{(-1)^{k+1}}{k!} = 1-\\frac12+\\frac16-\\frac1{24} = 0,625$."},{"id":"e7062b4f1","c":"c1","src":"Klausur 19.03.2025, A1","t":"Lotterie mit fünfstelligen Gewinnzahlen","q":"Lose mit fünfstelligen Gewinnzahlen (führende Nullen erlaubt, z. B. 00275), alle gleich wahrscheinlich. Eine Person kauft genau ein Los. Berechnen Sie:\na) P(Gewinnzahl enthält genau einmal die Ziffer 7)\nb) P(Gewinnzahl enthält mindestens einmal die Ziffer 7)\nc) P(Gewinnzahl ist streng aufsteigend, z. B. 24589)","s":"$|\\Omega| = 10^5 = 100\\,000$ (mit Zurücklegen, mit Reihenfolge).\na) Position der 7 wählen: $\\binom51 = 5$; übrige 4 Stellen je 9 Ziffern: $9^4 = 6561$.\n$$P = \\frac{5\\cdot 9^4}{10^5} = \\frac{32\\,805}{100\\,000} = 0,32805 = 32,805\\,\\%$$\nb) Gegenereignis „keine 7“: $9^5 = 59\\,049$.\n$$P = 1-\\frac{59\\,049}{100\\,000} = 0,40951 = 40,951\\,\\%$$\nc) Streng aufsteigend ⇒ 5 verschiedene Ziffern; jede 5-elementige Teilmenge von $\\{0, \\dots, 9\\}$ lässt sich genau auf eine Weise aufsteigend anordnen:\n$$P = \\frac{\\binom{10}{5}}{10^5} = \\frac{252}{100\\,000} = 0,00252 = 0,252\\,\\%$$"},{"id":"e496e2ea3","c":"c1","src":"Klausur 11.08.2025, A1","t":"Urne mit vier Farben","q":"In einer Urne liegen 5 rote, 6 grüne, 10 blaue und 15 gelbe Kugeln (36 insgesamt).\na) Es werden 4 Kugeln ohne Zurücklegen gezogen. P(mindestens eine grüne)?\nb) Wie viele Kugeln muss man mindestens ziehen, damit mit mindestens 90 % mindestens eine rote dabei ist?\nc) Es werden 6 Kugeln gezogen. P(alle vier Farben, aber keine Farbe mehr als zweimal)?","s":"a) Gegenereignis: 4 aus den 30 nicht-grünen.\n$$P = 1-\\frac{\\binom{30}{4}}{\\binom{36}{4}} = 1-\\frac{27\\,405}{58\\,905} = 1-0,46524 \\approx 0,5348 = 53,48\\,\\%$$\nb) Gegenereignis: alle $k$ Kugeln stammen aus den 31 nicht-roten. Gesucht ist das kleinste $k$ mit\n$$\\frac{\\binom{31}{k}}{\\binom{36}{k}} \\le 0,10$$\nRekursion: $\\frac{\\binom{31}{k+1}}{\\binom{36}{k+1}} = \\frac{\\binom{31}{k}}{\\binom{36}{k}}\\cdot\\frac{31-k}{36-k}$, und $\\frac{\\binom{31}{12}}{\\binom{36}{12}} = \\frac{24\\cdot23\\cdot22\\cdot21\\cdot20}{36\\cdot35\\cdot34\\cdot33\\cdot32} \\approx 0,1127$.\n- $k=12$: $0,1127 > 0,10$\n- $k=13$: $0,1127\\cdot\\frac{19}{24} \\approx 0,0893 \\le 0,10$\nAntwort: Es müssen mindestens 13 Kugeln gezogen werden.\nKorrekturhinweis: Die Lernzusammenfassung nennt 14, weil dort für $k=12$ fälschlich $0,134$ verwendet wird.\nc) Gesamt: $\\binom{36}{6} = 1\\,947\\,792$. Nur Farbverteilung $(2, 2, 1, 1)$ möglich; wähle die 2 doppelten Farben ($\\binom42=6$ Fälle):\n- rot, grün doppelt: $\\binom52\\binom62\\binom{10}1\\binom{15}1 = 22\\,500$\n- rot, blau: $10\\cdot45\\cdot6\\cdot15 = 40\\,500$\n- rot, gelb: $10\\cdot105\\cdot6\\cdot10 = 63\\,000$\n- grün, blau: $15\\cdot45\\cdot5\\cdot15 = 50\\,625$\n- grün, gelb: $15\\cdot105\\cdot5\\cdot10 = 78\\,750$\n- blau, gelb: $45\\cdot105\\cdot5\\cdot6 = 141\\,750$\nSumme $397\\,125$:\n$$P = \\frac{397\\,125}{1\\,947\\,792}\\approx 0,2039 = 20,39\\,\\%$$"},{"id":"e6ef28774","c":"c1","src":"Probeklausur, A1","t":"Würfelspiel mit vier Personen","q":"Vier Personen werfen je einen fairen Würfel. Wer die kleinste Augenzahl wirft, verliert. Wie groß ist die Wahrscheinlichkeit, dass es mehr als einen Verlierer gibt?","s":"$|\\Omega| = 6^4 = 1296$. Gegenereignis: genau ein Verlierer, d. h. das Minimum $m\\in\\{1, \\dots, 5\\}$ kommt genau einmal vor, die anderen drei Würfe sind größer.\nPerson mit $m$ wählen: 4 Möglichkeiten; die anderen je $(6-m)$ Möglichkeiten:\n$$|A^c| = \\sum_{m=1}^{5} 4(6-m)^3 = 4(125+64+27+8+1) = 900$$\n$$P(A) = 1-\\frac{900}{1296} = 1-\\frac{25}{36} = \\frac{11}{36}\\approx 30,56\\,\\%$$"},{"id":"efd0bbd42","c":"c1","src":"Klausur 19.12.2024, A4","t":"Sieben Bäume in einer Reihe","q":"Sieben unterschiedlich hohe Bäume werden zufällig in eine Reihe gepflanzt. Eine Passantin blickt von vorne; ein Baum ist sichtbar, wenn kein Baum vor ihm höher ist. Wie groß ist P(mindestens drei Bäume sichtbar)?\nHinweis: Steht der höchste Baum nicht vorne, sind immer mindestens zwei sichtbar (der erste und der höchste).","s":"$|\\Omega| = 7! = 5040$. Gegenereignis: 1 oder 2 Bäume sichtbar.\n- Genau 1 sichtbar ⇔ höchster Baum an Position 1: $6! = 720$ Anordnungen.\n- Genau 2 sichtbar ⇔ höchster Baum an Position $j\\ge 2$ und der erste Baum ist der höchste unter den ersten $j-1$ Bäumen. Für den höchsten Baum an Position $j$: $\\frac{6!}{j-1}$ Anordnungen der übrigen, also\n$$\\sum_{j=2}^{7}\\frac{720}{j-1} = 720\\left(1+\\frac12+\\frac13+\\frac14+\\frac15+\\frac16\\right) = 1764$$\n$$P(\\text{mind. 3}) = 1-\\frac{720+1764}{5040} = 1-\\frac{2484}{5040} = \\frac{71}{140}\\approx 50,71\\,\\%$$"},{"id":"e6ee9fd1c","c":"c2","src":"V2, Folien 2–4","t":"Geburtstagsparadoxon","q":"In einem Raum sind $n$ Personen. Mit welcher Wahrscheinlichkeit haben mindestens zwei am selben Tag Geburtstag? (365 Tage, gleich wahrscheinlich, unabhängig)","s":"$\\Omega=\\{1, \\dots, 365\\}^n$. Gegenereignis „alle verschieden“ (ohne Zurücklegen, mit Reihenfolge):\n$$P(A^c) = \\frac{365\\cdot364\\cdots(365-n+1)}{365^n} = \\prod_{i=0}^{n-1}\\frac{365-i}{365}$$\n$$P(A) = 1-\\prod_{i=0}^{n-1}\\frac{365-i}{365}$$\n$n=23$: $\\approx 50,7\\,\\%$; $n=65$: $\\approx 99,8\\,\\%$."},{"id":"edf7b8050","c":"c2","src":"V2, Folie 28","t":"Zwei schwarze Karten","q":"Aus einem Skatblatt (16 rote, 16 schwarze Karten) werden nacheinander ohne Zurücklegen zwei Karten gezogen. Wie groß ist die Wahrscheinlichkeit für zwei schwarze Karten?","s":"$$P(A\\cap B) = P(A)P(B|A) = \\frac{16}{32}\\cdot\\frac{15}{31} = \\frac{15}{62}\\approx 24,19\\,\\%$$"},{"id":"e50a9c826","c":"c2","src":"V2, Folie 30","t":"Zweite Karte schwarz","q":"Skatblatt wie oben. Wie groß ist die Wahrscheinlichkeit, dass die 2. Karte schwarz ist?","s":"Totale Wahrscheinlichkeit mit $A_1$ = 1. schwarz, $A_2$ = 1. rot:\n$$P(B) = \\frac{15}{31}\\cdot\\frac12+\\frac{16}{31}\\cdot\\frac12 = \\frac{31}{62} = \\frac12$$"},{"id":"eb87d2084","c":"c2","src":"V2, Folie 31","t":"Teilungsproblem bei Spielabbruch","q":"Zwei Freunde setzen je 2,50 € ein; jede Runde gewinnt jeder mit 50 %. Wer zuerst 5 Runden gewonnen hat, erhält den gesamten Einsatz (5 €). Das Spiel wird beim Stand 3 : 2 abgebrochen. Wie ist der Einsatz gerecht zu verteilen?","s":"Spieler 1 fehlen 2 Siege, Spieler 2 fehlen 3 Siege. Spätestens nach 4 weiteren Runden wäre entschieden. Spieler 2 gewinnt nur, wenn er von 4 fiktiven Runden mindestens 3 gewinnt:\n$$P(\\text{Sp. 2}) = \\frac{\\binom43+\\binom44}{2^4} = \\frac{5}{16},\\qquad P(\\text{Sp. 1}) = \\frac{11}{16}$$\nGerechte Aufteilung: Spieler 1 erhält $\\frac{11}{16}\\cdot5\\,€\\approx 3,44\\,€$, Spieler 2 $\\frac{5}{16}\\cdot 5\\,€\\approx 1,56\\,€$."},{"id":"e14b0f3e1","c":"c2","src":"V2, Folien 34–35","t":"HIV-Test (Satz von Bayes)","q":"Sensitivität 99,9 %, Spezifität 99,7 %, Prävalenz 0,05 %. Eine zufällige Person testet positiv. Wie groß ist die Wahrscheinlichkeit, dass sie tatsächlich infiziert ist?","s":"$A_1$: infiziert, $A_2$: nicht infiziert, $B$: Test positiv.\n$$P(A_1|B) = \\frac{0,999\\cdot0,0005}{0,999\\cdot0,0005+0,003\\cdot0,9995}\\approx 0,143 = 14,3\\,\\%$$"},{"id":"e92c70824","c":"c2","src":"V2, Folien 37–38","t":"Maschine aus zwei Bauteilen","q":"Zwei unabhängig arbeitende Bauteile funktionieren mit 95 % bzw. 90 %. Die Maschine läuft nur, wenn beide funktionieren. Mit welcher Wahrscheinlichkeit fällt sie aus?","s":"$$P(\\text{Ausfall}) = 1-P(A\\cap B) = 1-0,95\\cdot0,9 = 0,145 = 14,5\\,\\%$$"},{"id":"e2580764a","c":"c2","src":"V2, Folie 43","t":"Würfelspiel reihum – gewinnt Claudia?","q":"Anna, Bernd, Claudia und Dirk würfeln reihum (in dieser Reihenfolge). Wer zuerst eine 6 würfelt, gewinnt sofort. Mit welcher Wahrscheinlichkeit gewinnt Claudia (in %, eine Dezimale)?","s":"$p=\\frac16$, $q=\\frac56$. Claudia gewinnt in einer Runde, wenn Anna und Bernd keine 6 haben und sie eine 6 würfelt: $q^2p = \\frac{25}{216}$. Eine ganze Runde ohne 6: $q^4 = \\frac{625}{1296}$.\n$$P = \\sum_{k=0}^{\\infty}(q^4)^k\\,q^2p = \\frac{q^2p}{1-q^4} = \\frac{25/216}{671/1296} = \\frac{150}{671}\\approx 22,4\\,\\%$$"},{"id":"e28afc16c","c":"c2","src":"Probeklausur, A2","t":"Chips von drei Zulieferern","q":"A liefert 20 %, B 30 %, C 50 % der Chips. Fehlerfrei sind bei A 99 %, bei B 95 %, bei C 90 %. Ein zufälliger Chip ist fehlerfrei. Wie groß ist die Wahrscheinlichkeit, dass er von A stammt?","s":"Totale Wahrscheinlichkeit:\n$$P(F) = 0,99\\cdot0,2+0,95\\cdot0,3+0,9\\cdot0,5 = 0,198+0,285+0,45 = 0,933$$\nBayes:\n$$P(A|F) = \\frac{0,198}{0,933}\\approx 0,2122 = 21,22\\,\\%$$"},{"id":"e115d84ca","c":"c2","src":"Klausur 11.08.2025, A3a","t":"Medizinischer Test","q":"1 % der Bevölkerung ist erkrankt. Falsch-positiv-Rate 10 %, Falsch-negativ-Rate 10 %. Eine Person testet positiv. Wie wahrscheinlich ist sie tatsächlich erkrankt?","s":"$P(K)=0,01$, $P(T^+|K)=0,9$, $P(T^+|K^c)=0,1$.\n$$P(K|T^+) = \\frac{0,9\\cdot0,01}{0,9\\cdot0,01+0,1\\cdot0,99} = \\frac{0,009}{0,108} = \\frac{1}{12}\\approx 8,33\\,\\%$$"},{"id":"e8c54b885","c":"c3","src":"V3, Folien 14–45","t":"Kennzahlen der Bonbon-Stichprobe","q":"Urliste: 51, 49, 49, 50, 52, 53, 50, 48, 51, 51. Bestimmen Sie Mittelwert, Median, 0,25- und 0,3-Quantil, Spannweite, Interquartilsabstand, mittlere absolute Abweichung und empirische Varianz.","s":"Geordnet: 48, 49, 49, 50, 50, 51, 51, 51, 52, 53.\n- $\\bar x = \\frac{504}{10} = 50,4$\n- Median ($n=10$ gerade): $\\frac12(x_5+x_6) = \\frac12(50+51) = 50,5$\n- $\\tilde x_{0,25}$: $np=2,5$ → $x_3 = 49$; $\\tilde x_{0,75}$: $np = 7,5$ → $x_8 = 51$\n- $\\tilde x_{0,3}$: $np=3$ → $\\frac12(x_3+x_4) = 49,5$\n- $R = 53-48 = 5$, $d_Q = 51-49 = 2$\n- Mittlere absolute Abweichung: $1,2$\n- $\\sum x_i^2 = 25\\,422$: $s^2 = \\frac{25\\,422-10\\cdot 50,4^2}{9} = \\frac{20,4}{9}\\approx 2,267$, $s\\approx 1,506$"},{"id":"eec0de8a1","c":"c3","src":"V3, Folie 48","t":"Varianz und Standardabweichung berechnen","q":"Stichprobe: 13, 25, 7, 18, 19, 22, −2, 5, 13. Berechnen Sie Varianz und Standardabweichung.","s":"$n=9$, $\\sum x_i = 120$, $\\bar x = \\frac{120}{9}\\approx 13,333$, $\\sum x_i^2 = 2210$.\n$$s^2 = \\frac{1}{8}\\left(2210 - 9\\cdot\\left(\\frac{40}{3}\\right)^2\\right) = \\frac{2210-1600}{8} = 76,25$$\n$$s = \\sqrt{76,25}\\approx 8,732$$"},{"id":"e432bf69d","c":"c3","src":"V3, Folie 25","t":"Geometrisches Mittel bei Zinsen","q":"Ein Kapital wird zwei Jahre verzinst: 5 % im ersten, 7 % im zweiten Jahr. Welcher mittlere Zinsfaktor ist korrekt?","s":"$K_2 = 1,05\\cdot1,07\\,K_0 = 1,1235\\,K_0$.\nArithmetisch: $1,06^2 = 1,1236$ (leicht falsch).\nGeometrisch: $\\bar x_{\\text{geom}} = \\sqrt{1,05\\cdot1,07}\\approx 1,05995$, $1,05995^2 = 1,1235$ (exakt)."},{"id":"ea66c12ca","c":"c3","src":"V3, Folien 27–30","t":"Einkommen: Mittelwert vs. Median","q":"Einkommen: 29 100, 32 400, 36 500, 37 000, 38 500, 39 000, 42 300, 42 900, 860 000 €. Vergleichen Sie arithmetisches Mittel und Median.","s":"$\\bar x = \\frac{1\\,157\\,700}{9}\\approx 128\\,633\\,€$, Median (5. Wert von 9) $= 38\\,500\\,€$.\nDer Ausreißer 860 000 € verzerrt den Mittelwert stark; der Median ist robust."},{"id":"ed27cc9e3","c":"c3","src":"Übung (Lernliste Kap. 4)","t":"Harmonisches Mittel: Durchschnittsgeschwindigkeit","q":"Eine Strecke wird hin mit 60 km/h und zurück mit 40 km/h gefahren. Wie groß ist die Durchschnittsgeschwindigkeit?","s":"Gleich lange Teilstrecken → harmonisches Mittel:\n$$\\bar x_{\\text{har}} = \\left(\\frac12\\left(\\frac{1}{60}+\\frac{1}{40}\\right)\\right)^{-1} = \\left(\\frac{1}{48}\\right)^{-1} = 48\\ \\text{km/h}$$\n(nicht 50 km/h!)"},{"id":"e3b340b1e","c":"c3","src":"Übung (zu V3, Folie 60)","t":"Regressionsgerade berechnen","q":"Gegeben sind die Punkte $(1, 2), (2, 3), (3, 5), (4, 6)$. Bestimmen Sie $r_{xy}$ und die Regressionsgerade.","s":"$\\bar x = 2,5$, $\\bar y = 4$.\n$$s_{xy} = \\frac13[(-1,5)(-2)+(-0,5)(-1)+0,5\\cdot1+1,5\\cdot2] = \\frac73$$\n$s_x^2 = \\frac13(2,25+0,25+0,25+2,25) = \\frac53$, $s_y^2 = \\frac13(4+1+1+4) = \\frac{10}{3}$\n$$r_{xy} = \\frac{7/3}{\\sqrt{5/3\\cdot10/3}}\\approx 0,990$$\n$$k = \\frac{s_{xy}}{s_x^2} = \\frac{7/3}{5/3} = 1,4,\\qquad d = 4-1,4\\cdot2,5 = 0,5$$\nRegressionsgerade: $y = 1,4x+0,5$."},{"id":"e4963ebd8","c":"c4","src":"V4, Folie 12","t":"Glücksspiel mit 4 Münzen","q":"4 faire Münzen werden geworfen. Gewinn $X = \\max\\{(k-1)^3, 0\\}$, wobei $k$ = Anzahl Kopf. Geben Sie die Verteilung von $X$ an.","s":"$k\\sim\\mathrm{Bi}(4; \\frac12)$: $P(k) = \\frac{1}{16}, \\frac{4}{16}, \\frac{6}{16}, \\frac{4}{16}, \\frac{1}{16}$ für $k=0, \\dots, 4$.\n$X$: $k=0$ oder $1$ → 0; $k=2$ → 1; $k=3$ → 8; $k=4$ → 27.\n<table class=\"tbl\"><tr><th>$x_i$<\/th><td>0<\/td><td>1<\/td><td>8<\/td><td>27<\/td><\/tr><tr><th>$p_i$<\/th><td>$\\frac{5}{16}$<\/td><td>$\\frac{6}{16}$<\/td><td>$\\frac{4}{16}$<\/td><td>$\\frac{1}{16}$<\/td><\/tr><\/table>"},{"id":"e9309f54a","c":"c4","src":"V4, Folie 16","t":"5 Münzen: Anzahl Zahl","q":"5 faire Münzen, $X$ = Anzahl „Zahl“. Tabelle mit $x_i$, $p_i$ und $F(x_i)$.","s":"<table class=\"tbl\"><tr><th>$x_i$<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr><tr><th>$32p_i$<\/th><td>1<\/td><td>5<\/td><td>10<\/td><td>10<\/td><td>5<\/td><td>1<\/td><\/tr><tr><th>$32F(x_i)$<\/th><td>1<\/td><td>6<\/td><td>16<\/td><td>26<\/td><td>31<\/td><td>32<\/td><\/tr><\/table>\nStabdiagramm der $p_i$ symmetrisch um 2,5; $F$ ist eine Treppenfunktion mit Sprüngen bei 0, …, 5."},{"id":"e52803e26","c":"c4","src":"V4, Folie 17","t":"Kleinste Primzahl ≥ Augenzahl","q":"Ein fairer Würfel wird einmal geworfen. $X$ = kleinste Primzahl, die größer oder gleich der Augenzahl ist.\n1) Grundmenge, 2) formale Definition, 3) Realisationen, 4) Verteilung, 5)–6) Stabdiagramm und Verteilungsfunktion.","s":"1) $\\Omega=\\{1, \\dots, 6\\}$\n2) $X:\\Omega\\to\\mathbb{R}$, $X(\\omega) = \\min\\{q \\text{ prim}: q\\ge\\omega\\}$, also $X(1)=2$, $X(2)=2$, $X(3)=3$, $X(4)=5$, $X(5)=5$, $X(6)=7$\n3) Realisationen: 2, 3, 5, 7\n4) <table class=\"tbl\"><tr><th>$x_i$<\/th><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><\/tr><tr><th>$p_i$<\/th><td>$\\frac26$<\/td><td>$\\frac16$<\/td><td>$\\frac26$<\/td><td>$\\frac16$<\/td><\/tr><tr><th>$F(x_i)$<\/th><td>$\\frac13$<\/td><td>$\\frac12$<\/td><td>$\\frac56$<\/td><td>1<\/td><\/tr><\/table>\n6) $F$: 0 für $x<2$, $\\frac13$ auf $[2, 3)$, $\\frac12$ auf $[3, 5)$, $\\frac56$ auf $[5, 7)$, 1 ab 7."},{"id":"e1ff7e914","c":"c4","src":"Klausur 19.03.2025, A2","t":"Verteilungsfunktion $1-e^{-2x}(2x+1)$","q":"$F(x) = 1-e^{-2x}(2x+1)$ für $x\\ge0$, sonst 0.\na) Dichtefunktion? b) $z_p = 3$: Bestimmen Sie $p$. c) $Y = X^2+X$: Berechnen Sie $P(Y>2)$.","s":"a) Produkt- und Kettenregel für $x\\ge0$:\n$$f(x) = -\\left[(-2e^{-2x})(2x+1)+2e^{-2x}\\right] = 2e^{-2x}(2x+1)-2e^{-2x} = 4x\\,e^{-2x}$$\nund $f(x)=0$ für $x<0$.\nb) $p = F(3) = 1-7e^{-6}\\approx 0,98265$\nc) $X^2+X>2 \\iff (X+2)(X-1)>0 \\iff X>1$ (da $X\\ge0$ fast sicher, also $X+2>0$):\n$$P(Y>2) = 1-F(1) = 3e^{-2}\\approx 0,4060$$"},{"id":"e80795e95","c":"c4","src":"Klausur 11.08.2025, A4a","t":"Logistische Verteilung: Verteilungsfunktion","q":"$f(x) = \\dfrac{e^{-\\frac{x-\\alpha}{\\beta}}}{\\beta\\left(1+e^{-\\frac{x-\\alpha}{\\beta}}\\right)^2}$ mit $\\alpha\\in\\mathbb{R}$, $\\beta>0$. Bestimmen und vereinfachen Sie $F$.","s":"Substitution $u = 1+e^{-\\frac{t-\\alpha}{\\beta}}$, $du = -\\frac1\\beta e^{-\\frac{t-\\alpha}{\\beta}}dt$; Grenzen: $t\\to-\\infty \\Rightarrow u\\to\\infty$, $t=x \\Rightarrow u = 1+e^{-\\frac{x-\\alpha}{\\beta}}$.\n$$F(x) = \\int_{\\infty}^{1+e^{-\\frac{x-\\alpha}{\\beta}}}\\left(-\\frac{1}{u^2}\\right)du = \\left[\\frac1u\\right]_{\\infty}^{1+e^{-\\frac{x-\\alpha}{\\beta}}} = \\frac{1}{1+e^{-\\frac{x-\\alpha}{\\beta}}}$$"},{"id":"eaa01359c","c":"c4","src":"Klausur 16.03.2026, A4a+b","t":"Rayleigh-Verteilung: F und Median","q":"$f(x) = \\frac{x}{\\sigma^2}e^{-\\frac{x^2}{2\\sigma^2}}$ für $x\\ge0$, sonst 0 ($\\sigma>0$). a) $F$? b) Median?","s":"a) Für $x\\ge0$ mit $u = \\frac{t^2}{2\\sigma^2}$, $du = \\frac{t}{\\sigma^2}dt$:\n$$F(x) = \\int_0^{\\frac{x^2}{2\\sigma^2}} e^{-u}\\,du = 1-e^{-\\frac{x^2}{2\\sigma^2}}$$\nund $F(x) = 0$ für $x<0$.\nb) $1-e^{-\\frac{m^2}{2\\sigma^2}} = \\frac12 \\iff \\frac{m^2}{2\\sigma^2} = \\ln 2$:\n$$x_{0,5} = \\sigma\\sqrt{2\\ln 2}\\approx 1,1774\\,\\sigma$$"},{"id":"e820c5df6","c":"c4","src":"Probeklausur, A3a+d","t":"Pareto-Verteilung: Wahrscheinlichkeit und Median","q":"$f(x) = \\frac{\\alpha k^\\alpha}{x^{\\alpha+1}}$ für $x\\ge k$, sonst 0 ($k, \\alpha>0$). a) $P(1<X<2)$, d) Median.","s":"Verteilungsfunktion für $x\\ge k$:\n$$F(x) = \\int_k^x \\alpha k^\\alpha t^{-\\alpha-1}dt = k^\\alpha\\left[-t^{-\\alpha}\\right]_k^x = 1-\\left(\\frac kx\\right)^\\alpha$$\na) $P(1<X<2) = F(2)-F(1)$, Fallunterscheidung:\n- $k\\le1$: $\\left(1-\\frac{k^\\alpha}{2^\\alpha}\\right)-\\left(1-k^\\alpha\\right) = k^\\alpha\\left(1-2^{-\\alpha}\\right)$\n- $1<k<2$: $1-\\left(\\frac k2\\right)^\\alpha$\n- $k\\ge2$: $0$\nd) $1-\\left(\\frac km\\right)^\\alpha = \\frac12 \\iff m = k\\cdot 2^{1/\\alpha}$"},{"id":"ef6298984","c":"c5","src":"V4, Folie 40","t":"Kleinste Primzahl ≥ Augensumme","q":"Zwei faire Würfel; $X$ = kleinste Primzahl $\\ge$ Augensumme. 1) $\\Omega$, 2) Verteilung, 3) $E(X)$.","s":"1) $\\Omega = \\{1, \\dots, 6\\}^2$, $|\\Omega| = 36$.\n2) Summe → $X$: 2→2, 3→3, 4,5→5, 6,7→7, 8–11→11, 12→13.\n<table class=\"tbl\"><tr><th>$x_i$<\/th><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>11<\/td><td>13<\/td><\/tr><tr><th>$36p_i$<\/th><td>1<\/td><td>2<\/td><td>7<\/td><td>11<\/td><td>14<\/td><td>1<\/td><\/tr><\/table>\n3) $$E(X) = \\frac{2+6+35+77+154+13}{36} = \\frac{287}{36}\\approx 7,97$$"},{"id":"e76f1daa1","c":"c5","src":"V4, Folie 41","t":"Spiel „4 aus 25“","q":"Der Spieler kreuzt 4 von 25 Zahlen an; 4 Kugeln werden ohne Zurücklegen gezogen. 4 Richtige: 1000 €, 3 Richtige: 10 €, sonst nichts. Einsatz 1 €. $X$ = Gewinn (Auszahlung minus Einsatz). Berechnen Sie $E(X)$.","s":"$\\binom{25}{4} = 12\\,650$. $P(4) = \\frac{1}{12\\,650}$, $P(3) = \\frac{\\binom43\\binom{21}{1}}{12\\,650} = \\frac{84}{12\\,650}$.\n$$E(X) = 999\\cdot\\frac{1}{12\\,650}+9\\cdot\\frac{84}{12\\,650}-1\\cdot\\frac{12\\,565}{12\\,650} = \\frac{1840}{12\\,650}-1\\approx -0,85\\,€$$"},{"id":"e62f93ef2","c":"c5","src":"V4, Folie 42","t":"Würfeln bis zur ersten 6","q":"Es wird gewürfelt, bis erstmals eine 6 fällt. $X$ = Anzahl der Versuche (inkl. Erfolg). Bestimmen Sie $E(X)$.","s":"$P(X=k) = q^{k-1}p$ mit $p=\\frac16$, $q=\\frac56$.\n$$E(X) = \\sum_{k\\ge1}k\\,q^{k-1}p = \\frac pq\\sum_{k\\ge1}k\\,q^k = \\frac pq\\cdot\\frac{q}{(1-q)^2} = \\frac1p = 6$$"},{"id":"e7cc0be20","c":"c5","src":"V4, Folie 55","t":"Beweis des Verschiebungssatzes","q":"Beweisen Sie $\\sigma^2 = E(X^2)-\\mu^2$.","s":"$$\\operatorname{Var}(X) = E\\left((X-\\mu)^2\\right) = E(X^2-2\\mu X+\\mu^2) = E(X^2)-2\\mu E(X)+\\mu^2 = E(X^2)-\\mu^2$$\n(Linearität des Erwartungswertes, $E(X)=\\mu$.)"},{"id":"ebed3d7d7","c":"c5","src":"V4, Folie 67","t":"Tschebyscheff beim Würfel","q":"$X$ = Augenzahl, $\\mu=3,5$, $\\sigma^2 = \\frac{35}{12}$. a) Schätzen Sie $P(\\frac32<X<\\frac{11}{2})$ mit Tschebyscheff ab. b) Berechnen Sie die Wahrscheinlichkeit exakt.","s":"a) $\\frac32<X<\\frac{11}2 \\iff |X-3,5|<2$:\n$$P(|X-3,5|<2) = 1-P(|X-3,5|\\ge2)\\ge1-\\frac{35/12}{4} = 1-\\frac{35}{48} = \\frac{13}{48}\\approx 0,271$$\nb) $X\\in\\{2, 3, 4, 5\\}$: $P = \\frac46 = \\frac23\\approx 0,667$. Die Abschätzung ist korrekt, aber grob."},{"id":"efe1668ac","c":"c5","src":"V6, Folie 2","t":"Unkorreliert, aber nicht unabhängig","q":"Würfel; $X=-1$ bei 1 oder 2, $X=0$ bei 3 oder 4, $X=1$ bei 5 oder 6; $Y=X^2$. Zeigen Sie: $X, Y$ unkorreliert, aber nicht unabhängig.","s":"$E(X) = \\frac13(-1+0+1) = 0$, $E(XY) = E(X^3) = 0$, also $\\operatorname{Cov}(X, Y) = E(XY)-E(X)E(Y) = 0$.\n$P(X=0, Y=1) = 0\\ne P(X=0)P(Y=1) = \\frac13\\cdot\\frac23$ ⇒ nicht unabhängig."},{"id":"e350247b4","c":"c5","src":"Klausur 19.12.2024, A1","t":"Glücksspiel: quadrierte Augensumme","q":"Zwei faire Würfel; die Augensumme $S$ wird quadriert und als Gewinn in € ausgezahlt.\na) Welchen Einsatz muss der Anbieter verlangen, um im Mittel 5 € pro Spiel zu verdienen (ganze Euro)?\nb) Welchen Einsatz, damit er in der nächsten Runde mit mindestens 75 % keinen Verlust macht?","s":"a) $S$ hat die Werte 2 bis 12 mit Wahrscheinlichkeiten $\\frac{1}{36}, \\frac{2}{36}, \\dots, \\frac{6}{36}, \\dots, \\frac{1}{36}$:\n$$E(S^2) = \\frac{1}{36}\\big(4\\cdot1+9\\cdot2+16\\cdot3+25\\cdot4+36\\cdot5+49\\cdot6$$\n$$+64\\cdot5+81\\cdot4+100\\cdot3+121\\cdot2+144\\cdot1\\big)$$\n$$= \\frac{1974}{36}\\approx 54,83$$\nEinsatz $e$: $e-54,83 = 5 \\Rightarrow e\\approx 59,83$, also 60 €.\nb) Kein Verlust ⇔ $S^2\\le e$. $P(S\\le8) = \\frac{26}{36}\\approx 72,2\\,\\% < 75\\,\\%$, $P(S\\le9) = \\frac{30}{36}\\approx 83,3\\,\\%\\ge75\\,\\%$.\nAlso $e\\ge 9^2 = 81$ €."},{"id":"e9851bad4","c":"c5","src":"Klausur 19.03.2025, A4","t":"Logarithmische Verteilung","q":"$P(X=k) = -\\frac{p^k}{k\\ln(1-p)}$ für $k\\in\\mathbb{N}$, $p\\in(0, 1)$. a) $E(X)$, b) $\\operatorname{Var}(X)$.","s":"a) $$E(X) = \\sum_{k\\ge1}k\\cdot\\frac{-p^k}{k\\ln(1-p)} = \\frac{-1}{\\ln(1-p)}\\sum_{k\\ge1}p^k = \\frac{-p}{(1-p)\\ln(1-p)}$$\nb) $$E(X^2) = \\frac{-1}{\\ln(1-p)}\\sum_{k\\ge1}k\\,p^k = \\frac{-p}{(1-p)^2\\ln(1-p)}$$\n$$\\operatorname{Var}(X) = \\frac{-p}{(1-p)^2\\ln(1-p)}-\\frac{p^2}{(1-p)^2\\ln^2(1-p)} = \\frac{-p\\left(\\ln(1-p)+p\\right)}{(1-p)^2\\ln^2(1-p)}$$"},{"id":"ebb4d6163","c":"c5","src":"Klausur 16.12.2025, A1","t":"Maximum dreier Würfe","q":"Ein fairer Würfel wird dreimal geworfen, $X$ = größte Augenzahl. a) $P(X=4)$, b) $E(X)$, c) Standardabweichung.","s":"$P(X\\le k) = \\left(\\frac k6\\right)^3$, also $P(X=k) = \\frac{k^3-(k-1)^3}{216}$: $\\frac{1}{216}, \\frac{7}{216}, \\frac{19}{216}, \\frac{37}{216}, \\frac{61}{216}, \\frac{91}{216}$.\na) $P(X=4) = \\frac{64-27}{216} = \\frac{37}{216}\\approx 0,1713$\nb) $E(X) = \\frac{1+14+57+148+305+546}{216} = \\frac{1071}{216} = \\frac{119}{24}\\approx 4,958$\nc) $E(X^2) = \\frac{1+28+171+592+1525+3276}{216} = \\frac{5593}{216}\\approx 25,894$\n$\\operatorname{Var}(X) = 25,894-4,958^2\\approx 1,3084$, $\\sigma\\approx 1,1439$"},{"id":"ed2734112","c":"c5","src":"Probeklausur, A3b+c","t":"Pareto-Verteilung: Erwartungswert und Varianz","q":"$f(x) = \\frac{\\alpha k^\\alpha}{x^{\\alpha+1}}$ für $x\\ge k$. Bestimmen Sie $E(X)$ und $\\operatorname{Var}(X)$.","s":"$$E(X) = \\int_k^\\infty \\alpha k^\\alpha x^{-\\alpha}dx = \\alpha k^\\alpha\\left[\\frac{x^{1-\\alpha}}{1-\\alpha}\\right]_k^\\infty = \\frac{\\alpha k}{\\alpha-1}\\quad(\\alpha>1)$$\nFür $\\alpha\\le1$ divergiert das Integral (kein endlicher Erwartungswert).\n$$E(X^2) = \\alpha k^\\alpha\\int_k^\\infty x^{1-\\alpha}dx = \\frac{\\alpha k^2}{\\alpha-2}\\quad(\\alpha>2)$$\n$$\\operatorname{Var}(X) = \\frac{\\alpha k^2}{\\alpha-2}-\\frac{\\alpha^2k^2}{(\\alpha-1)^2} = \\frac{\\alpha k^2}{(\\alpha-1)^2(\\alpha-2)}\\quad(\\alpha>2)$$"},{"id":"e15ef377f","c":"c5","src":"Klausur 16.03.2026, A4c","t":"Rayleigh-Verteilung: Erwartungswert","q":"$f(x) = \\frac{x}{\\sigma^2}e^{-\\frac{x^2}{2\\sigma^2}}$ für $x\\ge0$. Bestimmen Sie $E(X)$.","s":"Partielle Integration mit $u = x$, $v' = \\frac{x}{\\sigma^2}e^{-\\frac{x^2}{2\\sigma^2}}$, $v = -e^{-\\frac{x^2}{2\\sigma^2}}$:\n$$E(X) = \\left[-x\\,e^{-\\frac{x^2}{2\\sigma^2}}\\right]_0^\\infty+\\int_0^\\infty e^{-\\frac{x^2}{2\\sigma^2}}dx = 0+\\frac12\\sigma\\sqrt{2\\pi} = \\sigma\\sqrt{\\frac\\pi2}\\approx 1,2533\\,\\sigma$$\n(Gauß-Integral: $\\int_{-\\infty}^{\\infty}e^{-\\frac{x^2}{2\\sigma^2}}dx = \\sigma\\sqrt{2\\pi}$.)"},{"id":"e6c57a8b4","c":"c5","src":"Klausur 11.08.2025, A4b","t":"Logistische Verteilung: Erwartungswert","q":"Bestimmen Sie den Erwartungswert der logistischen Verteilung mit Parametern $\\alpha, \\beta$.","s":"Mit $y = \\frac{x-\\alpha}{\\beta}$ ist $f$ proportional zu $g(y) = \\frac{e^{-y}}{(1+e^{-y})^2} = \\frac{e^{y}}{(1+e^{y})^2} = g(-y)$ (Zähler und Nenner mit $e^{2y}$ erweitert).\n$f$ ist also symmetrisch um $\\alpha$; da die Dichte exponentiell abfällt, existiert $E(X)$, und es gilt\n$$E(X) = \\alpha$$"},{"id":"ea1d76616","c":"c6","src":"V5, Folien 6–15","t":"Gleichverteilung: alle Kennzahlen herleiten","q":"$X$ gleichverteilt auf $[a, b]$. Bestimmen Sie Dichte, $E(X)$, $\\operatorname{Var}(X)$, $\\sigma$ und das p-Quantil.","s":"- Dichte: $f = F' = \\frac{1}{b-a}$ auf $(a, b)$, sonst 0\n- $E(X) = \\int_a^b\\frac{x}{b-a}dx = \\frac{a+b}{2}$\n- $E(X^2) = \\frac13(b^2+ab+a^2)$ ⇒ $\\operatorname{Var}(X) = \\frac{(b-a)^2}{12}$\n- $\\sigma = \\frac{b-a}{2\\sqrt3}$\n- $x_p = p(b-a)+a$"},{"id":"eeee76708","c":"c6","src":"V5, Folie 18","t":"Exponentialverteilung: alle Kennzahlen herleiten","q":"$X$ exponentialverteilt mit Parameter $k>0$. Bestimmen Sie Dichte, $E(X)$, $\\operatorname{Var}(X)$, $\\sigma$ und das p-Quantil.","s":"- $f(x) = k e^{-kx}$ für $x>0$, sonst 0\n- $E(X) = \\frac1k$ (partielle Integration)\n- $E(X^2) = \\frac{2}{k^2}$ ⇒ $\\operatorname{Var}(X) = \\frac{1}{k^2}$, $\\sigma = \\frac1k$\n- $x_p = -\\frac1k\\ln(1-p)$"},{"id":"e1c0de618","c":"c6","src":"V5, Folien 20–28","t":"Urne: genau 2 blaue Kugeln","q":"20 Kugeln (4 blau, 16 rot), 5 ohne Zurücklegen. P(genau 2 blaue), $E(X)$, $\\operatorname{Var}(X)$?","s":"$$P(X=2) = \\frac{\\binom42\\binom{16}3}{\\binom{20}5} = \\frac{3360}{15\\,504}\\approx 0,217$$\n$E(X) = 5\\cdot\\frac{4}{20} = 1$, $\\operatorname{Var}(X) = 5\\cdot0,2\\cdot0,8\\cdot\\frac{15}{19}\\approx0,63$, $\\sigma\\approx0,79$."},{"id":"ecfa626af","c":"c6","src":"V6, Folien 14–16","t":"Würfel 7-mal: genau 3-mal die 1","q":"Ein fairer Würfel wird 7-mal geworfen. P(genau 3-mal die 1)?","s":"$X\\sim\\mathrm{Bi}(7; \\frac16)$:\n$$P(X=3) = \\frac{7\\cdot6\\cdot5}{3!}\\left(\\frac16\\right)^3\\left(\\frac56\\right)^4\\approx0,078$$"},{"id":"ed9ffd63b","c":"c6","src":"V6, Folien 24–26","t":"Lieferung mit fehlerhaften Einheiten","q":"2000 Einheiten, 60 fehlerhaft, Stichprobe 50. P(genau 2 fehlerhaft) a) exakt, b) binomial genähert.","s":"a) $X\\sim H(50; 60; 2000)$: $$P(X=2) = \\frac{\\binom{60}2\\binom{1940}{48}}{\\binom{2000}{50}}\\approx0,259$$\nb) $n = 50 < \\frac{N}{20} = 100$ ⇒ $\\mathrm{Bi}(50; 0,03)$: $$P(X=2)\\approx\\binom{50}2 0,03^2\\cdot0,97^{48}\\approx0,255$$"},{"id":"ecbcf5894","c":"c6","src":"V6, Folien 35–37","t":"Defekte Werkstücke","q":"Defektanteil $p=0,002$, $n=800$ Stück. P(höchstens zwei defekt) a) exakt, b) mit Poisson.","s":"a) $\\mathrm{Bi}(800; 0,002)$: $\\sum_{k=0}^2\\binom{800}k0,002^k0,998^{800-k}\\approx0,783$\nb) $n>50$, $p<0,1$ ⇒ $\\lambda = 1,6$: $e^{-1,6}\\left(1+1,6+\\frac{1,6^2}{2}\\right)\\approx0,783$"},{"id":"e76726742","c":"c6","src":"Klausur 19.12.2024, A2","t":"Notrufe in der Polizeiwache","q":"Durchschnittlich 6,9 Notrufe pro Stunde, poissonverteilt.\na) P(mehr als 2 Notrufe in 15 Minuten)?\nb) Welche Anzahl an Notrufen pro Stunde ist am wahrscheinlichsten? Wie groß ist diese Wahrscheinlichkeit?","s":"a) $\\lambda_{15} = \\frac{6,9}{4} = 1,725$:\n$P(0)\\approx0,1782$, $P(1)\\approx0,3073$, $P(2)\\approx0,2651$\n$$P(X>2) = 1-0,7506\\approx0,2494$$\nb) $\\lambda = 6,9$, Modus $\\lfloor6,9\\rfloor = 6$:\n$$P(Y=6) = \\frac{6,9^6}{6!}e^{-6,9}\\approx0,1510$$\n(Kontrolle: $P(Y=7)\\approx0,1489$.)"},{"id":"ecb66dd07","c":"c6","src":"Klausur 16.12.2025, A4","t":"Roulette","q":"37 Zahlen 0 bis 36, gleich wahrscheinlich.\na) P(bei 37 Spielen nie die 0)?\nb) P(bei 74 Spielen genau 5-mal eine durch 13 teilbare Zahl) – mit Poisson nähern und begründen.\nc) Wie viele verschiedene Zahlen werden bei 37 Spielen durchschnittlich getroffen?","s":"a) $\\left(\\frac{36}{37}\\right)^{37}\\approx0,3629$\nb) Durch 13 teilbar (ohne 0): 13 und 26 ⇒ $p = \\frac{2}{37}\\approx0,054$. $n = 74>50$ und $p<0,1$ ⇒ Poisson mit $\\lambda = 74\\cdot\\frac{2}{37} = 4$:\n$$P(X=5) = \\frac{4^5}{5!}e^{-4}\\approx0,1563$$\nc) Indikator $\\mathbb{1}_i$ = „Zahl $i$ mindestens einmal getroffen“, $P = 1-\\left(\\frac{36}{37}\\right)^{37}$:\n$$E = 37\\left(1-\\left(\\tfrac{36}{37}\\right)^{37}\\right)\\approx23,57$$\nHinweis: Streng genommen ist auch 0 durch 13 teilbar. Die Lernzusammenfassung rechnet (wie das glatte $\\lambda = 4$ nahelegt) mit $\\{13, 26\\}$. Mit der 0 wäre $p = \\frac{3}{37}$, $\\lambda = 6$ und $P(X=5)\\approx0,1606$."},{"id":"ed57a765b","c":"c6","src":"Klausur 16.03.2026, A3a+c","t":"Poisson-Verteilungen","q":"a) $X$ poissonverteilt mit $P(X=1) = P(2\\le X\\le3)$. Berechnen Sie $P(X=4)$.\nc) $Z\\sim\\mathrm{Po}(1,5)$, $G$ = gerade Zahlen. Berechnen Sie $P(Z\\in G)$ (Hinweis: zuerst $P(Z\\in G)-P(Z\\notin G)$).","s":"a) $\\lambda e^{-\\lambda} = \\left(\\frac{\\lambda^2}{2}+\\frac{\\lambda^3}{6}\\right)e^{-\\lambda} \\iff 6 = 3\\lambda+\\lambda^2 \\iff \\lambda^2+3\\lambda-6 = 0$\n$$\\lambda = \\frac{-3+\\sqrt{33}}{2}\\approx1,3723,\\qquad P(X=4) = \\frac{\\lambda^4}{24}e^{-\\lambda}\\approx0,0375$$\nc) $$P(G)-P(G^c) = \\sum_{k\\ge0}(-1)^k\\frac{\\lambda^k}{k!}e^{-\\lambda} = e^{-\\lambda}e^{-\\lambda} = e^{-2\\lambda} = e^{-3}$$\nMit $P(G)+P(G^c) = 1$: $$P(Z\\in G) = \\frac{1+e^{-3}}{2}\\approx0,5249$$"},{"id":"e139559ba","c":"c7","src":"V7, Folie 8","t":"Tabellenwerte der Standardnormalverteilung","q":"Bestimmen Sie $\\Phi(1,28)$, $\\Phi(-1,71)$, $z_{0,8554}$ und $z_{0,3629}$.","s":"- $\\Phi(1,28)\\approx0,8997$\n- $\\Phi(-1,71) = 1-\\Phi(1,71) = 1-0,9564 = 0,0436$\n- $z_{0,8554}\\approx1,06$ (da $\\Phi(1,06)\\approx0,8554$)\n- $z_{0,3629} = -z_{0,6371}\\approx-0,35$"},{"id":"e4ccc2e48","c":"c7","src":"V7, Folie 11","t":"Füllgewichte: 90 %-Intervall","q":"Füllgewicht $N(100; 5^2)$ in Gramm. Bestimmen Sie $[\\mu-a, \\mu+a]$, in das 90 % aller Gewichte fallen.","s":"$P(|X-100|\\le a) = 2\\Phi\\left(\\frac a5\\right)-1 = 0,9 \\iff \\Phi\\left(\\frac a5\\right) = 0,95$\n$\\frac a5 = z_{0,95}\\approx1,645 \\Rightarrow a\\approx8,22$\nIntervall: $[91,78; 108,22]$ g."},{"id":"e6bfeede5","c":"c7","src":"V7, Folie 12","t":"Reaktionszeit eines Autolenkers","q":"Reaktionszeit $N(0,6; 0,08^2)$ Sekunden. a) P(Reaktionszeit > 0,5 s)? b) Über welchem Wert liegt die Reaktionszeit mit 99 %?","s":"a) $$P(X>0,5) = 1-\\Phi\\left(\\frac{0,5-0,6}{0,08}\\right) = 1-\\Phi(-1,25) = \\Phi(1,25)\\approx0,8944$$\nb) Gesucht $x$ mit $P(X>x) = 0,99$, also das 1 %-Quantil:\n$$x_{0,01} = 0,6+0,08\\cdot z_{0,01} = 0,6-0,08\\cdot2,326\\approx0,414\\text{ s}$$"},{"id":"e5769f8e7","c":"c7","src":"V7, Folie 18","t":"Würfel 100-mal: Augensumme","q":"Ein fairer Würfel wird 100-mal geworfen. Wie groß ist $P(360\\le S\\le380)$? (Normalverteilung)","s":"$\\mu = 3,5$, $\\sigma^2 = \\frac{35}{12}$ je Wurf ⇒ $n\\mu = 350$, $\\sqrt n\\sigma = \\sqrt{100\\cdot35/12}\\approx17,08$.\nMit Stetigkeitskorrektur:\n$$P(360\\le S\\le380)\\approx\\Phi\\left(\\frac{380,5-350}{17,08}\\right)-\\Phi\\left(\\frac{359,5-350}{17,08}\\right) = \\Phi(1,79)-\\Phi(0,56)\\approx0,9629-0,7109\\approx0,252$$"},{"id":"ed108c254","c":"c7","src":"V7, Folie 19","t":"Frühlingsfest (Klausur März 2024)","q":"500 Gäste an 50 Tischen à 10 Personen würfeln; $A_i$ = Augensumme an Tisch $i$.\na) $E(A_i)$ und $\\sigma$? b) $P(A_1>44)$ (Normalverteilung)? c) P(genau 2 Tische mit $A_i>44$)? d) P(genau ein Tisch mit $A_i<24$)?","s":"a) $E(A_i) = 10\\cdot3,5 = 35$, $\\sigma = \\sqrt{10\\cdot\\frac{35}{12}}\\approx5,40$\nb) $P(A_1>44) = 1-P(A_1\\le44)\\approx1-\\Phi\\left(\\frac{44,5-35}{5,40}\\right) = 1-\\Phi(1,76)\\approx0,0393$\nc) Anzahl Tische $\\sim\\mathrm{Bi}(50; 0,0393)$: $$\\binom{50}{2}0,0393^2\\cdot0,9607^{48}\\approx0,276$$\nd) $P(A_i<24) = P(A_i\\le23)\\approx\\Phi\\left(\\frac{23,5-35}{5,40}\\right) = \\Phi(-2,13)\\approx0,0166$\n$$50\\cdot0,0166\\cdot0,9834^{49}\\approx0,366$$"},{"id":"ed202e249","c":"c7","src":"V7, Folien 21–22","t":"Fehlerhafte Bits","q":"Fehlerwahrscheinlichkeit pro Bit $10^{-5}$, $10^7$ Bit. P(mehr als 90 fehlerhafte Bit)? (Normalverteilung)","s":"$X\\sim\\mathrm{Bi}(10^7; 10^{-5})$, $np(1-p) = 99,999>9$ ⇒ $\\mu = 100$, $\\sigma\\approx9,99995$.\n$$P(X>90) = 1-F_B(90)\\approx1-\\Phi\\left(\\frac{90,5-100}{10}\\right) = 1-\\Phi(-0,95) = \\Phi(0,95)\\approx82,89\\,\\%$$"},{"id":"e22fe3282","c":"c7","src":"V7, Folie 23","t":"Halbleiter in der Endkontrolle","q":"3 % der Halbleiter fallen durch. P(in 1000 Stück mindestens 25 fehlerhaft)? (Normalverteilung)","s":"$\\mu = 30$, $\\sigma^2 = 1000\\cdot0,03\\cdot0,97 = 29,1>9$, $\\sigma\\approx5,394$.\n$$P(X\\ge25) = 1-P(X\\le24)\\approx1-\\Phi\\left(\\frac{24,5-30}{5,394}\\right) = 1-\\Phi(-1,02) = \\Phi(1,02)\\approx0,846$$"},{"id":"e61990fdb","c":"c7","src":"V7, Folie 25","t":"Staubteilchen","q":"Anzahl Staubteilchen pro Volumeneinheit $\\mathrm{Po}(20)$. P(weniger als 15)?","s":"$\\lambda = 20>9$ ⇒ $N(20; 20)$:\n$$P(X\\le14)\\approx\\Phi\\left(\\frac{14,5-20}{\\sqrt{20}}\\right) = \\Phi(-1,23) = 1-\\Phi(1,23)\\approx0,1093$$"},{"id":"e7d7e2898","c":"c7","src":"V7, Folie 26","t":"Netzwerkstörungen","q":"Im Mittel 16 Störungen pro Tag (Poisson). P(mehr als 20 Störungen)?","s":"$\\lambda = 16>9$, $\\sigma = 4$:\n$$P(X>20) = 1-P(X\\le20)\\approx1-\\Phi\\left(\\frac{20,5-16}{4}\\right) = 1-\\Phi(1,125)\\approx0,130$$"},{"id":"ee475617e","c":"c7","src":"Klausur 19.12.2024, A3 (V8, Folie 4)","t":"Weingläser","q":"315 Gläser pro Tag, 5 % Bruch, Ziel: 300 intakte. P(an mindestens 8 der nächsten 10 Tage Ziel erreicht)? Normalapproximation wo möglich, mit Begründung.","s":"1) Ein Tag: $X\\sim\\mathrm{Bi}(315; 0,95)$, $\\mu = 299,25$, $\\sigma^2 = 14,9625>9$ ⇒ Normalapproximation zulässig, $\\sigma\\approx3,868$.\n$$p_{\\text{Tag}} = P(X\\ge300) = 1-P(X\\le299)\\approx1-\\Phi\\left(\\frac{299,5-299,25}{3,868}\\right) = 1-\\Phi(0,065)\\approx0,4742$$\n2) Zehn Tage: $Y\\sim\\mathrm{Bi}(10; 0,4742)$ – hier ist $np(1-p)\\approx2,5<9$, also exakt rechnen:\n- $P(Y=8) = 45\\cdot0,4742^8\\cdot0,5258^2\\approx0,0318$\n- $P(Y=9) = 10\\cdot0,4742^9\\cdot0,5258\\approx0,0064$\n- $P(Y=10) = 0,4742^{10}\\approx0,0006$\n$$P(Y\\ge8)\\approx0,0388 = 3,88\\,\\%$$\nKorrekturhinweis: Die Lernzusammenfassung nennt 3,71 %, weil dort $0,4743^8$ falsch ($0,002447$ statt $0,002563$) berechnet wurde."},{"id":"e953ff640","c":"c7","src":"V8, Folie 5","t":"Klausurpunkte (Klausur Dezember 2023)","q":"29 Punkte erreichbar, 32 Studierende, Punkte ≈ $N(20; 5^2)$, nur ganze Punkte.\na) Erwartete Anzahl, die nicht besteht (weniger als 15 Punkte)?\nb) P(mindestens 4 Studierende bekommen 1,3 (26 oder 27 Punkte) oder 1,0 (ab 28 Punkten))?","s":"a) Weniger als 15 ⇔ höchstens 14 Punkte, mit Stetigkeitskorrektur:\n$$p = \\Phi\\left(\\frac{14,5-20}{5}\\right) = \\Phi(-1,1)\\approx0,1357$$\nErwartungswert: $32\\cdot0,1357\\approx4,34$ Studierende (ohne Stetigkeitskorrektur: $32\\cdot\\Phi(-1)\\approx5,08$).\nb) Mindestens 26 Punkte: $q = 1-\\Phi\\left(\\frac{25,5-20}{5}\\right) = 1-\\Phi(1,1)\\approx0,1357$.\nAnzahl $Y\\sim\\mathrm{Bi}(32; 0,1357)$; $npq\\approx3,75<9$ ⇒ exakt:\n$$P(Y\\ge4) = 1-\\sum_{k=0}^{3}\\binom{32}{k}q^k(1-q)^{32-k}\\approx0,648$$"},{"id":"e2bb7f29f","c":"c7","src":"V8, Folie 6","t":"Osterumsatz (Klausur März 2023)","q":"Umsatz pro Woche $N(120; 30^2)$ Mio. €, 4 unabhängige Wochen. P(Gesamtumsatz > 550 Mio. €)?","s":"Additionssatz: Summe $\\sim N(480; 4\\cdot900) = N(480; 60^2)$.\n$$P(S>550) = 1-\\Phi\\left(\\frac{550-480}{60}\\right) = 1-\\Phi(1,17)\\approx0,1217$$"},{"id":"ecea1b35c","c":"c7","src":"V8, Folie 7","t":"Jungen- und Mädchengeburten","q":"P(Junge) = 0,514.\na) Leipziger Uniklinik 2011: 2292 Geburten. P(mindestens 100 Jungen mehr als Mädchen)?\nb) Wie viele Geburten muss eine Klinik haben, damit P(mehr Mädchen als Jungen) < 0,05 ist?","s":"a) $J$ = Jungen, Mädchen $= 2292-J$. $J-(2292-J)\\ge100 \\iff J\\ge1196$.\n$\\mu = 2292\\cdot0,514 = 1178,09$, $\\sigma = \\sqrt{2292\\cdot0,514\\cdot0,486}\\approx23,93$ ($npq>9$).\n$$P(J\\ge1196)\\approx1-\\Phi\\left(\\frac{1195,5-1178,09}{23,93}\\right) = 1-\\Phi(0,73)\\approx0,233$$\nb) Mehr Mädchen ⇔ $J<\\frac n2$ (Normalapproximation ohne Stetigkeitskorrektur):\n$$P\\left(J<\\tfrac n2\\right)\\approx\\Phi\\left(\\frac{0,5n-0,514n}{\\sqrt{n\\cdot0,514\\cdot0,486}}\\right) = \\Phi\\left(-0,02801\\sqrt n\\right)<0,05$$\n$0,02801\\sqrt n>1,645 \\Rightarrow \\sqrt n>58,73 \\Rightarrow n\\ge3449$ Geburten."},{"id":"e4102c77d","c":"c7","src":"Klausur 19.03.2025, A3","t":"Bonbontüten im Karton","q":"70 % rote, 30 % grüne Bonbons; 30 Tüten pro Karton. Wie viele Bonbons muss jede Tüte enthalten, damit mit mindestens 95 % in allen Tüten mehr rote als grüne sind? (Normalverteilung, ohne Stetigkeitskorrektur)","s":"1) Alle 30 Tüten (unabhängig): $p_{\\text{Tüte}}^{30}\\ge0,95 \\Rightarrow p_{\\text{Tüte}}\\ge0,95^{1/30}\\approx0,99829$.\n2) Rote $R\\sim\\mathrm{Bi}(m; 0,7)$, $\\mu = 0,7m$, $\\sigma = \\sqrt{0,21m}$. Mehr rote als grüne ⇔ $R>0,5m$:\n$$P(R>0,5m)\\approx1-\\Phi\\left(\\frac{0,5m-0,7m}{\\sqrt{0,21m}}\\right) = \\Phi\\left(\\frac{0,2}{\\sqrt{0,21}}\\sqrt m\\right)\\ge0,99829$$\n$z_{0,99829}\\approx2,927$ ⇒ $0,4364\\sqrt m\\ge2,927 \\Rightarrow \\sqrt m\\ge6,707 \\Rightarrow m\\ge44,99$\nAntwort: mindestens 45 Bonbons pro Tüte."},{"id":"ec9c8b9bb","c":"c7","src":"Klausur 11.08.2025, A2","t":"Kaffeepulver-Abfüllung","q":"Abfüllmenge $X\\sim N(1000; 5^2)$ in Gramm.\na) P(weniger als 992 g)? b) P(Abweichung vom Sollwert höchstens 6 g)? c) Welche Toleranzgrenzen für maximal 3 % Ausschuss?","s":"a) $$P(X<992) = \\Phi\\left(\\frac{992-1000}{5}\\right) = \\Phi(-1,6) = 1-0,9452\\approx0,0548$$\nb) $$P(|X-1000|\\le6) = 2\\Phi(1,2)-1 = 2\\cdot0,8849-1\\approx0,7699$$\nc) Symmetrisch je 1,5 % Ausschuss: $1000\\pm z_{0,985}\\cdot5$, $z_{0,985}\\approx2,17$:\nToleranzgrenzen $[989,15; 1010,85]$ g."},{"id":"e8002ffc7","c":"c7","src":"Klausur 11.08.2025, A3b","t":"1000 positive Tests","q":"Aus A3a: $P(\\text{krank}\\mid\\text{positiv}) = \\frac1{12}$. Wie groß ist die Wahrscheinlichkeit, dass von 1000 positiv Getesteten mindestens 100 tatsächlich krank sind? (Normalverteilung)","s":"$Y\\sim\\mathrm{Bi}(1000; \\frac1{12})$: $\\mu\\approx83,33$, $\\sigma^2 = 1000\\cdot\\frac1{12}\\cdot\\frac{11}{12}\\approx76,39>9$, $\\sigma\\approx8,740$.\n$$P(Y\\ge100)\\approx1-\\Phi\\left(\\frac{99,5-83,33}{8,740}\\right) = 1-\\Phi(1,85)\\approx0,0322$$"},{"id":"ef452931f","c":"c7","src":"Klausur 16.12.2025, A2","t":"Hotelreservierungen","q":"192 Betten, 20 % der Reservierungen werden storniert. Wie viele Reservierungen dürfen maximal angenommen werden, wenn das Risiko einer Überbuchung höchstens 2,5 % sein soll? Normalverteilung mit Begründung.","s":"Erscheinende Gäste $X\\sim\\mathrm{Bi}(N; 0,8)$, $\\mu = 0,8N$, $\\sigma = 0,4\\sqrt N$. Zulässig, da $0,16N>9$ für $N>56,25$.\n$$P(X\\ge193)\\approx1-\\Phi\\left(\\frac{192,5-0,8N}{0,4\\sqrt N}\\right)\\le0,025 \\iff \\frac{192,5-0,8N}{0,4\\sqrt N}\\ge1,96$$\n$0,8N+0,784\\sqrt N-192,5\\le0$; mit $u = \\sqrt N$:\n$$u = \\frac{-0,784+\\sqrt{0,784^2+4\\cdot0,8\\cdot192,5}}{1,6}\\approx15,030 \\Rightarrow N\\le225,9$$\nMaximal 225 Reservierungen (Kontrolle: $N=225$ → 1,86 %, $N=226$ → 2,58 %)."},{"id":"ec6e1d01e","c":"c7","src":"Klausur 16.03.2026, A1","t":"Umsätze der Produkte A und B","q":"Tagesumsatz $A\\sim N(1800; 120^2)$, $B\\sim N(1600; 180^2)$, unabhängig.\na) $P(A>1900)$? b) $P(B>A)$? c) P(an mindestens 80 von 365 Tagen $A>1900$)? (Normalverteilung mit Begründung)","s":"a) $$P(A>1900) = 1-\\Phi\\left(\\frac{100}{120}\\right) = 1-\\Phi(0,83)\\approx0,2023$$\nb) $D = B-A\\sim N(-200; 180^2+120^2) = N(-200; 46\\,800)$, $\\sigma_D\\approx216,33$:\n$$P(D>0) = 1-\\Phi\\left(\\frac{200}{216,33}\\right) = 1-\\Phi(0,92)\\approx0,1777$$\nc) $Y\\sim\\mathrm{Bi}(365; 0,2023)$: $\\mu\\approx73,84$, $\\sigma^2\\approx58,90>9$ ⇒ zulässig, $\\sigma\\approx7,675$.\n$$P(Y\\ge80)\\approx1-\\Phi\\left(\\frac{79,5-73,84}{7,675}\\right) = 1-\\Phi(0,74)\\approx0,2304$$"},{"id":"e149eb1dc","c":"c7","src":"Klausur 16.03.2026, A3b","t":"Poisson mit Normalapproximation","q":"$Y$ poissonverteilt mit $E(Y) = 10$. Berechnen Sie $P(Y\\ge12)$ genähert mit der Normalverteilung und begründen Sie.","s":"$\\lambda = 10>9$ ⇒ Normalapproximation mit $\\mu = \\sigma^2 = 10$ zulässig.\n$$P(Y\\ge12) = 1-P(Y\\le11)\\approx1-\\Phi\\left(\\frac{11,5-10}{\\sqrt{10}}\\right) = 1-\\Phi(0,47)\\approx0,3176$$\n(Exakt wären es 0,3032.)"},{"id":"e26ff7633","c":"c7","src":"Probeklausur, A4","t":"Überbuchter Flug Leipzig–Paris","q":"15 % No-shows, akzeptiertes Überbuchungsrisiko 5 %; die Statistikabteilung verkauft maximal 212 Tickets. Wie viele Sitzplätze hat das Flugzeug wohl? (Normalverteilung)","s":"Erscheinende $X\\sim\\mathrm{Bi}(212; 0,85)$: $\\mu = 180,2$, $\\sigma = \\sqrt{212\\cdot0,85\\cdot0,15}\\approx5,199$ ($npq\\approx27>9$).\nBedingung für $S$ Sitze: $P(X\\ge S+1)\\approx1-\\Phi\\left(\\frac{S+0,5-180,2}{5,199}\\right)\\le0,05$\n$$\\frac{S+0,5-180,2}{5,199}\\ge1,645 \\Rightarrow S\\ge188,25 \\Rightarrow S = 189$$\nKontrolle: Mit 213 Tickets läge das Risiko bei 5,2 % > 5 %, mit 212 bei 3,7 % – passt zu „maximal 212“."},{"id":"e367c9737","c":"c8","src":"Übung (zu V8, Folien 17–18)","t":"Tschebyscheff für den Mittelwert","q":"$X_i$ u.i.v. mit $\\sigma^2 = 4$. Schätzen Sie für $n = 100$ die Wahrscheinlichkeit $P(|\\bar X-\\mu|\\ge0,5)$ nach oben ab. Wie groß muss $n$ sein, damit die Schranke höchstens 0,05 ist?","s":"$\\operatorname{Var}(\\bar X) = \\frac{4}{100} = 0,04$:\n$$P(|\\bar X-\\mu|\\ge0,5)\\le\\frac{0,04}{0,25} = 0,16$$\nSchranke $\\frac{4}{n\\cdot0,25}\\le0,05 \\iff n\\ge320$."},{"id":"e7319912d","c":"c9","src":"V9, Folie 11","t":"t-Quantile bestimmen","q":"Bestimmen Sie $t_{29;0,995}$, $t_{7;0,05}$, $t_{50;0,9}$ und $t_{62;0,3}$ (bei Bedarf mit Näherung).","s":"- $t_{29;0,995}\\approx2,756$ (Tabelle)\n- $t_{7;0,05} = -t_{7;0,95}\\approx-1,895$\n- $t_{50;0,9}\\approx z_{0,9}\\left(1+\\frac{1+z_{0,9}^2}{200}\\right) = 1,2816\\cdot1,0132\\approx1,298$\n- $t_{62;0,3} = -t_{62;0,7}\\approx-0,5244\\left(1
